# WASI / WebAssembly toolchain, build environment, and tasks.
#
# WASM orchestration lives in the testable Node.js tooling under scripts/wasm.
# Three scripts there stay shell. The two compiler wrappers, because cargo execs
# them once per translation unit, so a Node process per file is real build time,
# and `exec` keeps the compiler's own signal handling and exit status intact.
# And detect-wasi-sdk.sh, because [env] below runs it before mise installs the
# Node.js it pins - see that script's header.
# The static threaded rustflags live in .cargo/config.toml; the SDK-relative
# toolchain wiring lives in [env] below; orchestration lives in [tasks.*].
#
# Run `mise tasks` to list, `mise run build-wasm` for dev, `mise run build-wasm-prod` for CI/release.

[tools]
# Pinned toolchain. mise installs these on activation (and in CI via mise-action),
# so dev and CI share exact versions.
#
# Deliberately not pinned here:
#   - WASI SDK: its clang shadows the host and breaks libarchive-sys bindgen on
#     macOS. scripts/wasm/detect-wasi-sdk.sh locates it without changing PATH.
#   - sccache: install via OS package (brew install sccache / apt install sccache).
#   - twiggy: no binary releases (`cargo install` when needed for size analysis).
node = "24.18.0"
# rustfmt and clippy are not in the toolchain mise installs by default, and the
# `fmt` and `clippy` tasks below - which `mise run ci` depends on - are dead
# without them. Requesting them here means a fresh clone can run the gate after
# `mise install` alone. Masked on a workstation that already has a rustup
# `default` profile toolchain, and in CI, which adds them explicitly (see
# .github/actions/setup-build-env/action.yml).
rust = { version = "1.95.0", components = "rustfmt,clippy" }
# provides wasm-opt. ubi rather than aqua because aqua's registry entry covers
# only darwin and linux/amd64, so `mise install` hard-fails on linux/arm64 with
# `unsupported env: linux/arm64` - and mise retries that install on every later
# command, which takes the whole repo down on that host, not just wasm builds.
# Upstream does publish binaryen-version_129-aarch64-linux.tar.gz; the github
# backend resolves release assets directly and picks it up. The version is the
# release tag. (`ubi:` reaches the same assets but mise deprecated it - it warns
# on every install and is slated for removal in 2027.1.0.)
"github:WebAssembly/binaryen" = { version = "version_129", exe = "wasm-opt" }
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"ubi:bnjbvr/cargo-machete" = "0.9.1"
# Version is the release tag: nextest's repo prefixes tags with the crate name.
"ubi:nextest-rs/nextest" = { version = "cargo-nextest-0.9.140", exe = "cargo-nextest" }
"ubi:obi1kenobi/cargo-semver-checks" = "0.46.0"
"aqua:rhysd/actionlint" = "1.7.12"              # workflow linting (shellcheck-aware)
"aqua:koalaman/shellcheck" = "0.11.0"           # shell script linting (also backs actionlint's `run:` checks)
"aqua:hadolint/hadolint" = "2.14.0"             # Dockerfile linting

[env]
# WASI SDK discovery. detect-wasi-sdk.sh prints the SDK root, preferring an
# explicit $WASI_SDK_PATH, then legacy install locations. When no SDK is present
# these resolve to broken paths and the build tasks fail with a clear toolchain
# error - harmless for non-wasm commands.
#
# It must not need anything mise installs. This block is rendered before [tools]
# are installed, against a PATH that excludes them, so a `node` here breaks the
# whole repo on a machine that has no system Node.js - `mise install` included.
WASI_SDK_PATH = "{{ exec(command='sh ' ~ config_root ~ '/scripts/wasm/detect-wasi-sdk.sh') }}"
WASI_SYSROOT = "{{ env.WASI_SDK_PATH }}/share/wasi-sysroot"
WASI_CLANG = "{{ env.WASI_SDK_PATH }}/bin/clang"
WASI_CLANGXX = "{{ env.WASI_SDK_PATH }}/bin/clang++"
WASI_AR = "{{ env.WASI_SDK_PATH }}/bin/llvm-ar"
WASI_RANLIB = "{{ env.WASI_SDK_PATH }}/bin/llvm-ranlib"
WASI_STRIP = "{{ env.WASI_SDK_PATH }}/bin/llvm-strip"

# cc-rs toolchain wiring for C/C++ dependencies (liblzma, libarchive, ...).
# Single-threaded target.
CC_wasm32_wasip1 = "{{ env.WASI_CLANG }} --sysroot={{ env.WASI_SYSROOT }}"
CXX_wasm32_wasip1 = "{{ env.WASI_CLANGXX }} --sysroot={{ env.WASI_SYSROOT }}"
AR_wasm32_wasip1 = "{{ env.WASI_AR }}"
RANLIB_wasm32_wasip1 = "{{ env.WASI_RANLIB }}"
CFLAGS_wasm32_wasip1 = "-msimd128"
CXXFLAGS_wasm32_wasip1 = "-msimd128"

# Threaded target. CC/CXX point at the wrapper scripts that normalize the target
# triple and force-include the liblzma threading shim; they read WASI_CLANG/
# WASI_CLANGXX/WASI_SYSROOT from the env above.
CC_wasm32_wasip1_threads = "{{ config_root }}/scripts/wasm/wasm32-wasip1-threads-cc.sh"
CXX_wasm32_wasip1_threads = "{{ config_root }}/scripts/wasm/wasm32-wasip1-threads-cxx.sh"
AR_wasm32_wasip1_threads = "{{ env.WASI_AR }}"
RANLIB_wasm32_wasip1_threads = "{{ env.WASI_RANLIB }}"
CFLAGS_wasm32_wasip1_threads = "-matomics -mbulk-memory -msimd128"
CXXFLAGS_wasm32_wasip1_threads = "-matomics -mbulk-memory -msimd128"

# sccache owns incremental reuse, so disable Cargo incremental builds. Resolve
# the wrapper dynamically: an empty value builds normally on hosts without
# sccache instead of breaking every Cargo invocation. The larger cache avoids
# churn across worktrees.
RUSTC_WRAPPER = "{{ exec(command='command -v sccache || true') | trim }}"
CARGO_INCREMENTAL = "0"
SCCACHE_CACHE_SIZE = "35G"

# cc-rs falls back to RUSTC_WRAPPER above, so every cc-built C dep already goes
# through sccache. libarchive does not: it is built by cmake::Config
# (crates/rom-weaver-containers/libarchive/build.rs), and cmake-rs forwards no
# wrapper, so its ~130 translation units were the one part of the build sccache
# never saw. CMake initializes the cache variable from this environment variable
# (since 3.4), so no build.rs change is needed.
#
# Worth having, but only for a clean rebuild into the *same* target directory
# (measured: 1m55s -> 1m35s). It does nothing across worktrees. cmake-rs puts
# both the build tree and the patched libarchive sources under OUT_DIR, so every
# -I in the compile line carries the absolute target path; sccache hashes the
# command line and has no ccache-style base_dir rewriting, so a different target
# directory misses on all ~360 C compiles by construction.
#
# Resolved dynamically like RUSTC_WRAPPER: empty is a no-op for CMake, which
# keeps hosts without sccache - and CI, which deliberately installs none - on
# the plain compiler. The launcher bakes into CMakeCache.txt at configure time,
# so an existing OUT_DIR keeps building unwrapped until it is cleaned.
CMAKE_C_COMPILER_LAUNCHER = "{{ exec(command='command -v sccache || true') | trim }}"

# --- Tasks ----------------------------------------------------------------

[tasks.wasm-check]
description = "Type-check the threaded WASM target (containers lib)"
run = "cargo check -p rom-weaver-containers --target wasm32-wasip1-threads --lib"

[tasks.build-wasm]
description = "Build the threaded WASM app module (fast local dev build, no wasm-opt/brotli)"
# Release C builds add -O3 -flto on top of the lean check-time CFLAGS above.
# These mirror build-wasm-prod's flags; scripts/wasm/build-app.mjs holds the
# shared build body so only this CFLAGS block differs between the two tasks.
env.CFLAGS_wasm32_wasip1 = "-msimd128 -O3 -flto"
env.CXXFLAGS_wasm32_wasip1 = "-msimd128 -O3 -flto"
env.CFLAGS_wasm32_wasip1_threads = "-matomics -mbulk-memory -msimd128 -O3 -flto"
env.CXXFLAGS_wasm32_wasip1_threads = "-matomics -mbulk-memory -msimd128 -O3 -flto"
run = "node {{ config_root }}/scripts/wasm/build-app.mjs dev"

[tasks.build-wasm-prod]
description = "Build the threaded WASM app module with wasm-opt and brotli (CI/release)"
# Release C builds add -O3 -flto on top of the lean check-time CFLAGS above.
# Same flags as build-wasm; the prod-only wasm-opt + brotli tail lives in
# scripts/wasm/build-app.mjs, selected by the `prod` argument.
env.CFLAGS_wasm32_wasip1 = "-msimd128 -O3 -flto"
env.CXXFLAGS_wasm32_wasip1 = "-msimd128 -O3 -flto"
env.CFLAGS_wasm32_wasip1_threads = "-matomics -mbulk-memory -msimd128 -O3 -flto"
env.CXXFLAGS_wasm32_wasip1_threads = "-matomics -mbulk-memory -msimd128 -O3 -flto"
run = "node {{ config_root }}/scripts/wasm/build-app.mjs prod"

[tasks.build-wasm-twiggy]
description = "Build an unoptimized, symbol-rich WASM module for twiggy analysis"
env.CARGO_PROFILE_WASM_RELEASE_STRIP = "none"
env.CARGO_PROFILE_WASM_RELEASE_DEBUG = "true"
run = "node {{ config_root }}/scripts/wasm/build-twiggy.mjs"

# --- Quality gate ---------------------------------------------------------
# Single source of truth for the checks shared by lefthook (pre-commit) and CI.
# lefthook keeps its `glob` gating and just delegates the `run` to these tasks.

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --package rom-weaver-checksum --package rom-weaver-cli --package rom-weaver-containers --package rom-weaver-core --package rom-weaver-patches --check"

[tasks.clippy]
description = "Lint the workspace with clippy (warnings are errors)"
run = "cargo clippy --workspace --all-targets --no-deps -- -D warnings"

[tasks.typegen]
description = "Regenerate TypeScript bindings from Rust"
run = "cargo run -p rom-weaver-cli --features typescript-types --bin rom-weaver-typegen -- --write"

[tasks.typegen-check]
description = "Verify TypeScript bindings are up to date"
run = "cargo run -p rom-weaver-cli --features typescript-types --bin rom-weaver-typegen -- --check"

[tasks.manpages]
description = "Regenerate CLI man pages from Clap definitions"
run = "cargo run -p rom-weaver-cli --example generate_manpages -- --write"

[tasks.licenses]
description = "Generate a build-time third-party attribution bundle"
run = "node {{ config_root }}/scripts/build-license-bundle.mjs"

[tasks.licenses-check]
description = "Verify the build-time third-party attribution bundle"
run = "node {{ config_root }}/scripts/check-license-bundle.mjs"

[tasks.deny]
description = "Check Rust dependencies for advisories, licenses, and unknown sources"
# Policy lives in .config/deny.toml. This gates what enters the tree; `licenses-check`
# above generates the attribution bundle for what already did.
#
# Split into two halves because CI treats them differently: policy violations
# are authored by us and gate the build, advisories arrive on their own and
# only warn. Locally you want both, which is what this task still runs.
depends = ["deny-policy", "deny-advisories"]

[tasks.deny-policy]
description = "Check Rust dependencies for disallowed licenses and unknown sources"
run = "cargo deny --config {{ config_root }}/.config/deny.toml check licenses sources"

[tasks.deny-advisories]
description = "Check Rust dependencies for security advisories"
run = "cargo deny --config {{ config_root }}/.config/deny.toml check advisories"

[tasks.machete]
description = "Find unused Rust dependencies"
# Heuristic source scan, so confirmed false positives are recorded per-crate
# under [package.metadata.cargo-machete] with a reason rather than suppressed
# globally. --skip-target-dir keeps it off build artifacts.
#
# Paths are explicit because cargo-machete walks directories rather than
# workspace members. The workspace crates stay covered; bump these paths if
# another source checkout is added outside crates/.
run = """cargo-machete --skip-target-dir \
  crates \
 """

[tasks.semver-checks]
description = "Check published crates for accidental breaking API changes"
# No-op until the first crates.io publish - cargo-semver-checks diffs against
# the released baseline, so unpublished crates have nothing to compare to. The
# release workflow runs this per-crate and skips ones with no baseline; run it
# by hand here when you want the whole workspace at once.
run = "cargo semver-checks check-release --workspace"

[tasks.test-rust]
description = "Run the Rust workspace test suite"
# nextest schedules the run phase (per-test processes, better parallelism);
# it does not execute doctests, so those keep a plain `cargo test --doc` pass
# - dropping them would silently shrink the suite.
run = [
  "cargo nextest run --workspace",
  "cargo test --quiet --doc --workspace",
]

[tasks.coverage-rust]
description = "Run the Rust workspace tests under llvm-cov and emit HTML + lcov coverage"
# Requires cargo-llvm-cov + the llvm-tools-preview component. llvm-cov recompiles
# the workspace with instrumentation into its own target subdir, so this does not
# reuse the normal `cargo test` artifacts - run it on demand, not in the gate.
# Collect once with --no-report, then emit both formats from the same profdata.
run = "node {{ config_root }}/scripts/coverage-rust.mjs"

[tasks.actionlint]
description = "Lint GitHub Actions workflows and composite actions"
# Catches undefined action inputs, bad expressions, and (via the pinned
# shellcheck above) issues in `run:` scripts. Workflow bugs otherwise only
# surface as a failed run minutes after a push, so this belongs in the
# pre-commit hook.
run = "actionlint"

[tasks.docs-lint]
description = "Lint owned Markdown documentation"
run = "npm run docs:lint"

[tasks.shellcheck]
description = "Lint shell scripts"
# The Node.js tooling is covered by `npm test`; the handful of scripts that
# stay in shell - the container entrypoint, the installer, and the wasm
# compiler wrappers - are exec-shaped and still need a static analyzer.
# -x follows `source` directives so the wasm cc/cxx wrappers are checked
# against the fragment they share; -P SCRIPTDIR resolves those relative paths
# from each script's own directory, which is how the wrappers actually run.
run = "node {{ config_root }}/scripts/lint-tracked.mjs '*.sh' -- shellcheck -x -P SCRIPTDIR"

[tasks.whitespace]
description = "Check for whitespace errors, skipping vendored third-party trees"
run = "node {{ config_root }}/scripts/check-whitespace.mjs"

[tasks.hadolint]
description = "Lint Dockerfiles"
run = "node {{ config_root }}/scripts/lint-tracked.mjs '*Dockerfile' '*Dockerfile.*' -- hadolint --config .config/hadolint.yaml"

[tasks.thread-guards]
description = "Fail on threaded-WASM suppression regressions"
run = "node {{ config_root }}/scripts/check-thread-guards.mjs"

[tasks.dev]
description = "Run the webapp dev server"
run = "npm --prefix packages/rom-weaver-webapp run dev --"

[tasks.preview]
description = "Preview the built webapp"
run = "npm --prefix packages/rom-weaver-webapp run preview --"

[tasks.test-e2e-fast]
description = "Run CLI, WASM, browser, and real webapp E2E checks in parallel"
run = "npm --prefix packages/rom-weaver-webapp run test:e2e:fast"

[tasks.test-e2e-nightly]
description = "Run exhaustive CLI/WASM interaction matrices plus WebKit and webapp E2E"
run = "npm --prefix packages/rom-weaver-webapp run test:e2e:nightly"

[tasks.test-e2e-ios]
description = "Generate the archive corpus and serve the iOS matrix over HTTPS on the LAN"
run = "npm --prefix packages/rom-weaver-webapp run test:e2e:ios --"

[tasks.ci]
description = "Run the full local quality gate (mirrors CI)"
depends = ["fmt", "clippy", "typegen-check", "wasm-check", "thread-guards", "licenses-check", "deny", "machete", "actionlint", "docs-lint", "shellcheck", "hadolint", "test-rust", "build-wasm-prod"]
run = "node {{ config_root }}/scripts/run-ci.mjs"

# Benchmarks are not part of `ci`: they need a corpus of real disc images, which
# is not redistributable and so cannot live in the repository. Point BENCH_CORPUS
# at your own. See docs/development/performance.md.
[tasks.bench-chd]
description = "Benchmark CHD compress/extract against chdman (needs BENCH_CORPUS, hyperfine, chdman)"
run = "node {{ config_root }}/scripts/bench-disc-tools.mjs --suite chd --corpus '{{ env.BENCH_CORPUS }}'"

[tasks.bench-rvz]
description = "Benchmark RVZ compress/extract against dolphin-tool (needs BENCH_CORPUS, hyperfine, dolphin-tool)"
run = "node {{ config_root }}/scripts/bench-disc-tools.mjs --suite rvz --corpus '{{ env.BENCH_CORPUS }}'"

[tasks.bench-7z]
description = "Benchmark 7z LZMA2 compress/extract against 7zz (needs BENCH_CORPUS, hyperfine, 7zz)"
run = "node {{ config_root }}/scripts/bench-disc-tools.mjs --suite 7z --corpus '{{ env.BENCH_CORPUS }}'"

[tasks.bench-zip]
description = "Benchmark zip deflate compress/extract against Info-ZIP (needs BENCH_CORPUS, hyperfine, zip/unzip)"
run = "node {{ config_root }}/scripts/bench-disc-tools.mjs --suite zip --corpus '{{ env.BENCH_CORPUS }}'"
