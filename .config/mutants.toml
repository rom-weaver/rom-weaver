# Build/cache directories MUST not be copied into nested mutation sandboxes.
gitignore = true
# Pure/low-I/O core modules are selected positively; codecs, OS I/O and generated
# schema catalogs are outside this initial lane, rather than assumed equivalent.
examine_globs = [
  "crates/rom-weaver-patches/src/**/*.rs",
  "crates/rom-weaver-checksum/src/**/*.rs",
  "crates/rom-weaver-core/src/cancel.rs",
  "crates/rom-weaver-core/src/concurrency.rs",
  "crates/rom-weaver-core/src/disc_sheet.rs",
  "crates/rom-weaver-core/src/n64.rs",
  "crates/rom-weaver-core/src/selection.rs",
  "crates/rom-weaver-core/src/prompt.rs",
]
# Test helpers contain assertions and fixture construction, not shipped behavior.
exclude_globs = ["crates/rom-weaver-patches/src/test_support.rs"]
# No equivalent-mutant exclusions: a survivor requires investigation, not relabeling.
# Only mutants that cannot compile are excluded by name.
# quality-reason: each replacement builds a value whose type has no `Default` (the
# generic `T` of `or_cancelled<T>` has no `Default` bound; the other types implement
# none), so it fails with E0277; the functions' other mutants still run.
exclude_re = [
  'CancellationToken::or_cancelled -> Result<T> with Ok\(Default::default\(\)\)',
  'ArtifactPack::parse -> Result<Self> with Ok\(Default::default\(\)\)',
  'replace parse_hashes -> Result<Vec<Hash>> with Ok\(vec!\[Default::default\(\)\]\)',
  'replace parse_components -> Result<\(Vec<PackComponent>, Vec<u32>\)> with Ok\(\(vec!\[Default::default\(\)\], ',
  'replace parse_games -> Result<Vec<PackGame>> with Ok\(vec!\[Default::default\(\)\]\)',
  'StreamingVariantChecksums::new_with_precomputed_raw -> Result<Self> with Ok\(Default::default\(\)\)',
]
