# `mise run deny-policy` gates licenses and sources; CI reports advisories separately.
# `mise run licenses-check` checks the generated attribution bundle.

[graph]
# Include native and threaded-WASM dependencies even when checking from one host.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-wasip1-threads",
]

[advisories]
version = 2
yanked = "deny"
# Limit unmaintained-crate reports to direct workspace dependencies.
# Vulnerability and yanked-crate checks still cover transitive dependencies.
unmaintained = "workspace"
ignore = [
    # XDVDFS depends directly on bincode 1.3.3 for its on-disk layout.
    # Replacements MUST preserve those bytes: https://rustsec.org/advisories/RUSTSEC-2025-0141.html
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
# Every license present in the tree as of this writing. Adding a dependency
# under a license not listed here fails the check by design - the shipped
# attribution bundle and the AGPL-3.0-or-later distribution terms both depend
# on knowing exactly what is linked in.
#
# `r-efi` also surfaces LGPL-2.1-or-later, but it is dual-licensed
# (Apache-2.0 OR LGPL-2.1-or-later OR MIT), so SPDX evaluation picks a
# permissive arm and no LGPL entry is needed here.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",       # this workspace's own crates
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",     # webpki-roots
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# LLVM-exception applies to the Rust core/wasi crates; the exception only
# loosens Apache-2.0, so it is safe wherever Apache-2.0 is. Only crates whose
# expression cannot be satisfied from `allow` above belong here: `rustix` and
# `linux-raw-sys` also carry LLVM-exception but offer an `OR MIT` arm, so SPDX
# evaluation never reaches for one and cargo-deny reports the entry as an
# unmatched exception.
#
# `libbz2-rs-sys` ships the permissive bzip2/libbzip2 v1.0.6 license (BSD-style,
# AGPL-compatible). It is pulled in only because upstream `qbsdiff` depends on
# `bzip2` with default features; the workspace `bzip2` pin keeps the C
# `bzip2-sys` backend selected, so this crate's codec is unused. Scoped here rather than added to `allow`
# so no other crate can land under this license unnoticed.
exceptions = [
    { name = "blake3", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { name = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
    { name = "wasi", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
# Duplicate versions are a size concern for the wasm bundle, not a correctness
# one, and the vendored forks pull in their own pinned trees. Warn so the churn
# is visible in CI logs without blocking.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
