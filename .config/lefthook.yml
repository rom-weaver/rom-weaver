pre-commit:
  # Each Cargo check uses a separate target directory to avoid Cargo's build lock.
  # CI keeps its sequential Rust checks in one target directory to reuse dependency artifacts.
  parallel: true
  commands:
    # Globs select checks from staged paths; each selected check runs over its full workspace.
    # CI adds tests and builds according to its change classification.
    rust-format:
      glob: "*.rs"
      run: mise run fmt
    rust-clippy:
      glob: "*.{rs,toml,lock}"
      run: env -u __MISE_DIFF CARGO_TARGET_DIR=target mise run clippy
    rust-typegen:
      glob: "*.rs"
      run: env -u __MISE_DIFF CARGO_TARGET_DIR=target/hook-typegen mise run typegen-check
    # RUSTFLAGS MUST NOT replace the configured threaded-target flags.
    # .cargo/config.toml includes -D warnings with the required target flags.
    wasm-threaded-check:
      glob: "*.{rs,toml,lock}"
      run: env -u __MISE_DIFF CARGO_TARGET_DIR=target/hook-wasm mise run wasm-check
    licenses-check:
      glob: "*.{toml,lock}"
      run: mise run licenses-check
    # Manifest and lockfile changes select dependency-policy checks without compiling code.
    # Advisories run separately in CI's non-gating security job.
    cargo-deny:
      glob: "*.{toml,lock}"
      run: mise run deny-policy
    cargo-machete:
      glob: "*.toml"
      run: mise run machete
    # Scoped to channel-icon inputs so generated assets are deterministic before
    # a commit. The files stay ignored under dist/generated-assets.
    channel-icons:
      glob:
        - "packages/rom-weaver-webapp/src/assets/app/root/logo.svg"
        - "packages/rom-weaver-webapp/design/icon-masters/*"
        - "packages/rom-weaver-webapp/src/webapp/accent-palette.mjs"
        - "packages/rom-weaver-webapp/src/webapp/brand-mark-assets.mjs"
        - "packages/rom-weaver-webapp/scripts/generate-channel-icons.mjs"
      run: npm --prefix packages/rom-weaver-webapp run icons:channels && npm --prefix packages/rom-weaver-webapp run icons:channels:check
    react-lint:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run lint:code
    react-format:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run format:check
    react-types:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run lint:types
    # The hook includes CI's static analyses so dead exports, browser incompatibilities,
    # and invalid message catalogs fail before commit.
    react-knip:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run lint:knip
    # The hook uses the same duplication threshold as CI.
    react-jscpd:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run lint:jscpd
    react-browser-compat:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run lint:browser-compat
    # An ungated `:hover` leaves tapped controls stuck in the hover look on
    # touch, which no other check here would catch. CSS-only, so scope the glob.
    react-touch-styles:
      glob: "packages/rom-weaver-webapp/**/*.css"
      run: npm --prefix packages/rom-weaver-webapp run lint:touch-styles
    # Across a cascade layer, order beats specificity outright, so an override can
    # start losing to a plainer rule with nothing to show for it. CSS-only glob.
    react-css-layers:
      glob: "packages/rom-weaver-webapp/**/*.css"
      run: npm --prefix packages/rom-weaver-webapp run lint:css-layers
    react-i18n:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run lint:i18n
    root-node-lint:
      glob:
        - "scripts/*.{mjs,cjs,js}"
        - "scripts/**/*.{mjs,cjs,js}"
        - "packages/rom-weaver-alias/*.{mjs,cjs,js}"
        - "packages/rom-weaver-alias/**/*.{mjs,cjs,js}"
        - ".oxlintrc.json"
        - "package.json"
        - "package-lock.json"
      run: npm run lint:code
    react-audit-strings:
      glob: "packages/rom-weaver-webapp/**"
      run: npm --prefix packages/rom-weaver-webapp run audit:strings
    # Release versions can precede publication of their platform packages.
    # Their local optional-dependency lock entries MUST survive npm operations so npm ci succeeds.
    root-lock-sync:
      glob: "package{,-lock}.json"
      run: npm ci --ignore-scripts --dry-run
    # Workflow mistakes are invisible until a push burns a runner minute, so
    # they are worth catching at commit time. Covers the composite actions too.
    actionlint:
      glob: ".github/**/*.{yml,yaml}"
      run: mise run actionlint
    # Same reasoning as actionlint: a broken script or image build otherwise
    # only shows up when a workflow, a self-hoster's `docker build`, or a
    # worktree setup run trips over it. Both tasks lint every tracked file, so
    # the glob only decides whether the check is worth running at all.
    shellcheck:
      glob: "*.sh"
      run: mise run shellcheck
    hadolint:
      glob: "{Dockerfile,Dockerfile.*,**/Dockerfile,**/Dockerfile.*,.config/hadolint.yaml}"
      run: mise run hadolint
    markdown-toc:
      files: git diff --name-only --cached --diff-filter=ACMR -- README.md CONTRIBUTING.md CLA.md docs .github/CODE_OF_CONDUCT.md .github/RELEASING.md .github/SECURITY.md packages/rom-weaver-webapp/design/icon-masters/README.md packages/rom-weaver-webapp/src/wasm/README.md scripts/wasm/README.md
      run: node scripts/update-markdown-toc.mjs {files}
      stage_fixed: true
    markdownlint:
      files: git diff --name-only --cached --diff-filter=ACMR -- '*.md'
      run: npm run docs:lint -- {files}
    whitespace:
      # Same task CI runs, so an exclusion can never apply to one and not the
      # other. Vendored trees are skipped: they are verbatim upstream snapshots,
      # and restyling them would turn every refresh into a merge.
      run: mise run whitespace
    thread-guard-regressions:
      glob: "*.rs"
      run: mise run thread-guards

commit-msg:
  commands:
    strip-ai-attribution:
      run: node ./scripts/strip-ai-attribution.mjs {1}
