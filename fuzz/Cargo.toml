[package]
name = "rom-weaver-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.151"
crc32fast = "=1.5.2"
rom-weaver-cli = { path = "../crates/rom-weaver-cli", default-features = false, features = ["fuzzing"] }
rom-weaver-core = { path = "../crates/rom-weaver-core" }
rom-weaver-patches = { path = "../crates/rom-weaver-patches" }

[[bin]]
name = "ips_apply"
path = "fuzz_targets/ips_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "save_parse"
path = "fuzz_targets/save_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "disc_sheet"
path = "fuzz_targets/disc_sheet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "weave_parse"
path = "fuzz_targets/weave_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_zip"
path = "fuzz_targets/dcp_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iso9660"
path = "fuzz_targets/iso9660.rs"
test = false
doc = false
bench = false
