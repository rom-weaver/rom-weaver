name: Build and deploy the webapp to Cloudflare Pages
description: >-
  Stamp the webapp bundle for one channel and Direct-Upload it to that
  channel's Pages project. The `deploy` matrix restamps the bundle the `wasm`
  job built and CI tested, and builds one only when that job built none. When
  building, callers are responsible for putting the module in
  packages/rom-weaver-webapp/src/wasm first.

inputs:
  channel:
    description: prod, beta, nightly or preview. Stamped into the bundle.
    required: true
  label:
    description: Masthead badge / PWA name text (usually the channel, `pr-<n>` for previews).
    required: true
  project:
    description: Cloudflare Pages project name.
    required: true
  branch:
    description: >-
      Pages branch. The project's production branch (main) publishes a live
      deployment; anything else is a throwaway preview.
    required: true
  bundle:
    description: >-
      "artifact" restamps the run's `webapp-dist` and `webapp-stamp-templates`
      artifacts for this channel; "build" builds the bundle for it.
    default: build
  identify-data-source:
    description: >-
      "cache" restores or builds the packs locally; "artifact" downloads the
      packs prepared by the current CI run.
    default: cache
  cloudflare-api-token:
    description: CLOUDFLARE_API_TOKEN.
    required: true
  cloudflare-account-id:
    description: CLOUDFLARE_ACCOUNT_ID.
    required: true

outputs:
  url:
    description: The deployment URL Cloudflare reported after success (empty if the deploy failed).
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    # Compiles nothing - runs vite and wrangler over a prebuilt module.
    - uses: ./.github/actions/setup-build-env
      with:
        tools: node
        cargo-cache: "false"
        webapp-deps: "true"
        emulatorjs-cache: ${{ inputs.bundle == 'build' && 'true' || 'false' }}

    - name: Download ROM identify data
      if: inputs.identify-data-source == 'artifact'
      uses: ./.github/actions/download-identify-data

    - name: Prepare ROM identify data
      if: inputs.identify-data-source == 'cache'
      uses: ./.github/actions/identify-data

    # The origin the deployment is served from. llms.txt, the Markdown
    # alternates, openapi.json and the API catalog name it instead of
    # production; canonical URLs and headers stay on production.
    - name: Resolve site origin
      id: origin
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        BRANCH: ${{ inputs.branch }}
        PROJECT: ${{ inputs.project }}
      run: |
        case "$CHANNEL" in
          prod) origin="https://rom-weaver.com" ;;
          beta) origin="https://beta.rom-weaver.com" ;;
          nightly) origin="https://nightly.rom-weaver.com" ;;
          preview) origin="https://${BRANCH}.${PROJECT}.pages.dev" ;;
          *) echo "unknown channel: $CHANNEL" >&2; exit 1 ;;
        esac
        echo "origin=$origin" >> "$GITHUB_OUTPUT"

    - name: Restore webapp build cache
      if: inputs.bundle == 'build'
      uses: ./.github/actions/webapp-build-cache

    # The channel stamps the bundle's visible identity - masthead badge, tab
    # title, PWA name and accent tokens - so a nightly or preview tab is never
    # mistaken for production.
    - name: Build webapp
      if: inputs.bundle == 'build'
      shell: bash
      env:
        ROM_WEAVER_CHANNEL: ${{ inputs.channel }}
        ROM_WEAVER_CHANNEL_LABEL: ${{ inputs.label }}
        ROM_WEAVER_SITE_ORIGIN: ${{ steps.origin.outputs.origin }}
        ROM_WEAVER_SYSTEM_CHROME: "1"
      run: npm --prefix packages/rom-weaver-webapp run build

    - name: Download tested webapp bundle
      if: inputs.bundle == 'artifact'
      uses: actions/download-artifact@v8
      with:
        name: webapp-dist
        path: packages/rom-weaver-webapp/dist

    - name: Download channel stamp templates
      if: inputs.bundle == 'artifact'
      uses: actions/download-artifact@v8
      with:
        name: webapp-stamp-templates
        path: packages/rom-weaver-webapp/build/channel-stamp

    # Rewrites only the channel's files. dist/assets stays the bytes E2E and Lighthouse tested.
    - name: Stamp webapp for channel
      if: inputs.bundle == 'artifact'
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        LABEL: ${{ inputs.label }}
        ORIGIN: ${{ steps.origin.outputs.origin }}
      run: npm --prefix packages/rom-weaver-webapp run stamp-channel -- "$CHANNEL" "$LABEL" "$ORIGIN"

    - name: Verify stamped webapp
      if: inputs.bundle == 'artifact'
      shell: bash
      env:
        ROM_WEAVER_CHANNEL: ${{ inputs.channel }}
        ROM_WEAVER_CHANNEL_LABEL: ${{ inputs.label }}
        ROM_WEAVER_SITE_ORIGIN: ${{ steps.origin.outputs.origin }}
      run: node packages/rom-weaver-webapp/scripts/verify-seo-build.mjs

    # Idempotent, so the first run on a channel bootstraps its own project and
    # no local wrangler auth is ever needed. The deploy wrapper also waits for
    # a matching new deployment to finish and reuses preview deployments when
    # a run is retried. Completed production deployments upload again so a
    # rerun can intentionally restore an older main commit.
    #
    # Uses the REST API rather than `wrangler pages project create`: wrangler
    # enumerates accounts internally, which a token scoped to specific account
    # resources cannot do, and it surfaces that as a bare "unknown error
    # [code: 8000000]" against an endpoint that works fine directly.
    - name: Ensure Cloudflare Pages project exists
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT: ${{ inputs.project }}
      run: node scripts/ci/ensure-cloudflare-pages-project.mjs

    - name: Deploy to Cloudflare Pages
      id: deploy
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT: ${{ inputs.project }}
        BRANCH: ${{ inputs.branch }}
        PAGES_REUSE: "true"
      run: node scripts/ci/deploy-pages.mjs
