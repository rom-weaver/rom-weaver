name: Build a release CLI platform package
description: >-
  Compile the native CLI for one entry of .github/cli-platforms.json and stage
  it into its npm platform package. CI runs this on every change and the release
  fan-out runs it to produce what actually ships, so the two must agree byte for
  byte - which is why the toolchain, cache key, cross wiring, and the MSVC
  environment dance live here once instead of in both workflows.

inputs:
  package:
    description: npm platform package name (matrix `package`).
    required: true
  target:
    description: rustc target triple (matrix `target`).
    required: true
  build:
    description: '"build" for cargo, "cross" for the cross-rs wrapper (matrix `build`).'
    required: true
  binary:
    description: Built binary file name (matrix `binary`).
    required: true
  msvc-arch:
    description: VsDevCmd.bat -arch value. Windows targets only.
    default: ""
  msvc-host:
    description: VsDevCmd.bat -host_arch value. Windows targets only.
    default: ""
  macos-deployment-target:
    description: >-
      Oldest macOS the shipped Darwin binaries must run on. Load-bearing: the
      build runners track the newest image GitHub offers, so this - not the
      runner version - is what holds the support floor still. macOS targets
      only; ignored elsewhere.
    default: "11.0"
  cache-save:
    description: >-
      Save the cargo cache after a miss. CI saves only on main; the release
      fan-out is restore-only unless its caller says otherwise.
    default: "false"
  registry-url:
    description: >-
      npm registry to configure Node against. The release fan-out needs it for
      the publish that follows; CI does not.
    default: ""

runs:
  using: composite
  steps:
    # The Windows runners' C: is remote-backed managed storage (~4-6k IOPS and
    # often worse); D: is the local temp disk (~9-19k IOPS). Move the hot paths
    # off C:: the crate registry and installed cargo binaries, the toolchain
    # rustc/std read on every compile, and the temp dirs the build churns
    # through. rustup, taiki-e/install-action, and rust-cache all honor these,
    # which is why this runs before the toolchain and cache steps below.
    #
    # D: is not documented as guaranteed - the win32-arm64 leg runs on
    # windows-11-arm, whose disk layout the runner-images docs do not state - so
    # the cargo/rustup moves are conditional on it existing. RUNNER_TEMP is
    # wherever the runner put it and is always the better temp dir, so TMP/TEMP
    # move either way. A one-time cache re-population is expected the first time
    # this lands; the shared-key scheme is unchanged.
    - name: Move Windows hot paths off the OS disk
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "TMP=$RUNNER_TEMP"
          echo "TEMP=$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
        if [ -d "/d" ]; then
          {
            echo 'CARGO_HOME=D:\cargo-home'
            echo 'RUSTUP_HOME=D:\rustup-home'
          } >> "$GITHUB_ENV"
        else
          echo "no D: drive on this runner; leaving CARGO_HOME/RUSTUP_HOME on C:"
        fi

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # CI and the release fan-out deliberately share one key per platform, so a
    # release restores what CI already built instead of spending a second set of
    # cache entries on the same artifacts. Keyed per entry - the nine platforms
    # share nothing.
    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: cli-platform-${{ inputs.package }}
        cache-on-failure: true
        save-if: ${{ inputs.cache-save == 'true' }}

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        APT_PACKAGES: cmake ninja-build pkg-config
      run: node scripts/ci/install-system-dependencies.mjs

    # The vendored LZMA SDK's x86-64 decode loop is MASM assembly with no distro
    # package to install it from, and without an assembler build.rs falls back to
    # the portable C loop - which is no faster than liblzma and gives up the 7z
    # extract parity with 7zz. Native x86-64 only: arm64 assembles its own loop
    # with clang, and the `cross` legs build inside cross-rs' container, which
    # Cross.toml handles instead. Windows x86-64 gets MASM's own ml64 from the
    # VsDevCmd step below. build.rs never fails over a missing assembler, so this
    # step is an optimisation, not a gate.
    - name: Install the x86-64 LZMA assembler
      if: runner.os == 'Linux' && inputs.build != 'cross' && startsWith(inputs.target, 'x86_64-')
      shell: bash
      run: sudo scripts/install-jwasm.sh

    - uses: taiki-e/install-action@v2
      if: inputs.build == 'cross'
      with:
        tool: cross@0.2.5

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}

    - name: Prepare ROM identify data
      uses: ./.github/actions/identify-data

    - name: Build release CLI
      if: runner.os != 'Windows' && inputs.build != 'cross'
      shell: bash
      # Empty on Linux, where no Darwin target is in play and the variable means
      # nothing to rustc.
      env:
        MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && inputs.macos-deployment-target || '' }}
      run: cargo build --locked --release --package rom-weaver-cli --target ${{ inputs.target }}

    - name: Build release CLI
      if: inputs.build == 'cross'
      shell: bash
      run: cross build --locked --release --package rom-weaver-cli --target ${{ inputs.target }}

    # vswhere locates the installed Visual Studio, and VsDevCmd.bat puts the
    # matching MSVC toolchain on PATH - the cross-arch legs (arm64, x86) do not
    # get one otherwise. It only exports into its own cmd session, hence the
    # cargo invocation living inside the same block.
    - name: Build release CLI
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=${{ inputs.msvc-arch }} -host_arch=${{ inputs.msvc-host }}
        cargo build --locked --release --package rom-weaver-cli --target ${{ inputs.target }}

    # rustc's own default deployment target differs per Darwin target and moves
    # with the toolchain, so read the floor back out of the Mach-O rather than
    # trusting that the env var on the build step took. Asserting only
    # `rustc --print=deployment-target` would prove what rustc *intended*, never
    # what it emitted - which is the whole question when the build image is
    # newer than the oldest macOS we ship for.
    - name: Verify macOS deployment target
      if: runner.os == 'macOS'
      shell: bash
      env:
        MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos-deployment-target }}
        BINARY: target/${{ inputs.target }}/release/${{ inputs.binary }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        test "$(rustc --print=deployment-target --target="$TARGET")" \
          = "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
        otool -l "$BINARY" | awk -v expected="$MACOSX_DEPLOYMENT_TARGET" '
          /LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/ { in_command = 1; next }
          in_command && /^( *minos| *version) / {
            print
            if ($2 == expected) found = 1
            in_command = 0
          }
          END { exit(found ? 0 : 1) }
        '

    - name: Stage the platform package
      shell: bash
      run: >-
        node scripts/prepare-npm-platform-package.mjs ${{ inputs.package }}
        target/${{ inputs.target }}/release/${{ inputs.binary }}
