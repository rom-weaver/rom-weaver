name: Dependabot auto-merge

# Enable auto-merge for Dependabot patch and minor updates after required checks pass.
# Major updates need a separate compatibility review.
on:
  pull_request:
    types: [opened, reopened, synchronize]

# One PR only needs auto-merge armed once; drop superseded runs on rapid pushes.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    # Dependabot PRs run with a read-only token by default; the `permissions`
    # block above elevates it. Guard on the actor so no other PR is touched.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
