name: winget dry run

# The Windows zips and `publish-winget` only run during a stable release. This
# proves both first: it zips the latest published npm platform packages with
# the release's packaging script, has Komac read each zip as `publish-winget`
# does, and installs each zip with winget from a local manifest shaped like the
# one submitted to microsoft/winget-pkgs. Nothing is published.
on:
  workflow_dispatch:
  # TODO(winget): remove before merge. workflow_dispatch needs the file on main.
  push:
    branches: [feat/winget-package]

permissions:
  contents: read

concurrency:
  group: winget-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zip:
    name: Zip ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: win32-x64-msvc, runner: windows-2025 }
          - { package: win32-ia32-msvc, runner: windows-2025 }
          - { package: win32-arm64-msvc, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Stands in for the npm-platform artifact npm-publish.yml downloads: the
      # published package is that artifact's contents.
      - name: Stage the published platform package
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/npm
          tarball=$(npm pack "@rom-weaver/$PACKAGE" --pack-destination .tmp/npm --silent)
          tar -xzf ".tmp/npm/$tarball" -C .tmp/npm
          cp -R .tmp/npm/package/. "packages/rom-weaver-cli-platforms/$PACKAGE/"

      - name: Package Windows zip
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
        run: ./scripts/ci/package-windows-zip.ps1 -Package $env:PACKAGE -Destination "rom-weaver-$env:PACKAGE.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: winget-zip-${{ matrix.package }}
          path: rom-weaver-${{ matrix.package }}.zip
          if-no-files-found: error
          retention-days: 3

  komac:
    name: Komac reads the zips
    needs: zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: winget-zip-*
          merge-multiple: true

      - name: Install Komac
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: komac@2.17.2

      # `komac update` builds each new installer entry from this analysis, so a
      # wrong architecture or nested file here is a wrong winget-pkgs manifest.
      - name: Analyze each zip
        run: |
          set -euo pipefail
          for pair in x64:x64 ia32:x86 arm64:arm64; do
            zip="rom-weaver-win32-${pair%%:*}-msvc.zip"
            architecture="${pair##*:}"
            analysis=$(komac analyze "$zip")
            printf '::group::%s\n%s\n::endgroup::\n' "$zip" "$analysis"
            grep -Eq "Architecture: $architecture\$" <<<"$analysis" ||
              { echo "::error::$zip is not detected as $architecture"; exit 1; }
            grep -Eq 'NestedInstallerType: portable$' <<<"$analysis" ||
              { echo "::error::$zip has no portable nested installer"; exit 1; }
            grep -Eq 'RelativeFilePath: bin[/\\]rom-weaver\.exe$' <<<"$analysis" ||
              { echo "::error::$zip does not nest bin/rom-weaver.exe"; exit 1; }
          done

  install:
    name: winget install ${{ matrix.package }}
    needs: zip
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: win32-x64-msvc, architecture: x64, runner: windows-2025 }
          - { package: win32-ia32-msvc, architecture: x86, runner: windows-2025 }
          - { package: win32-arm64-msvc, architecture: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: winget-zip-${{ matrix.package }}
          path: served

      - name: Install winget when the image lacks it
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget --version
            exit 0
          }
          Install-Module -Name Microsoft.WinGet.Client -Repository PSGallery -Force -Scope AllUsers
          Repair-WinGetPackageManager -AllUsers -Latest -Force
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
            [Environment]::GetEnvironmentVariable('Path', 'User')
          winget --version

      # winget needs an http(s) InstallerUrl even for a local manifest, so the
      # zip is served from localhost for the length of this step.
      - name: Install, run, and uninstall through winget
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          function Update-SessionPath {
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
              [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          function Get-InstalledPackCount([string] $Executable) {
            $database = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "empty-db-$(New-Guid)")
            $lines = & $Executable --no-progress identify database list --database-dir $database --json
            if ($LASTEXITCODE -ne 0) { throw "identify database list exited with $LASTEXITCODE" }
            $report = $lines | Where-Object { $_.Trim() } | Select-Object -Last 1 | ConvertFrom-Json
            $platforms = @($report.details.platforms)
            if ($platforms.Count -eq 0) { throw "no platform list in:`n$($lines -join "`n")" }
            $installed = @($platforms | Where-Object { $_.installed -eq $true }).Count
            Write-Host "$Executable reports $installed of $($platforms.Count) platform packs installed"
            $installed
          }

          Update-SessionPath
          $zip = "rom-weaver-$env:PACKAGE.zip"
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path served $zip)).Hash
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'served' -PassThru -NoNewWindow
          try {
            $manifests = New-Item -ItemType Directory -Force manifests
            $common = "PackageIdentifier: RomWeaver.RomWeaver`nPackageVersion: 0.0.1`n"
            Set-Content (Join-Path $manifests 'RomWeaver.RomWeaver.yaml') ($common + @"
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@)
            Set-Content (Join-Path $manifests 'RomWeaver.RomWeaver.installer.yaml') ($common + @"
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
          - RelativeFilePath: bin\rom-weaver.exe
            PortableCommandAlias: rom-weaver
          ArchiveBinariesDependOnPath: true
          Installers:
          - Architecture: $env:ARCHITECTURE
            InstallerUrl: http://127.0.0.1:8765/$zip
            InstallerSha256: $hash
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@)
            Set-Content (Join-Path $manifests 'RomWeaver.RomWeaver.locale.en-US.yaml') ($common + @"
          PackageLocale: en-US
          Publisher: rom-weaver
          PackageName: rom-weaver
          License: AGPL-3.0-or-later
          ShortDescription: Local-first offline toolkit for ROMs and ROM hack patches
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@)
            Get-ChildItem $manifests | ForEach-Object { Write-Output "--- $($_.Name)"; Get-Content $_ }

            winget settings --enable LocalManifestFiles
            winget validate --manifest $manifests
            if ($LASTEXITCODE -ne 0) { throw "winget validate exited with $LASTEXITCODE" }
            winget install --manifest $manifests --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "winget install exited with $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

          Update-SessionPath
          $command = Get-Command rom-weaver -CommandType Application | Select-Object -First 1
          Write-Output "rom-weaver resolves to $($command.Source)"
          if ($command.Source -notlike '*\WinGet\Packages\*\bin\rom-weaver.exe') {
            throw 'winget did not put the package bin directory on PATH'
          }
          & rom-weaver --version
          if ($LASTEXITCODE -ne 0) { throw "rom-weaver --version exited with $LASTEXITCODE" }

          $installed = Get-InstalledPackCount $command.Source
          if ($installed -eq 0) { throw 'the winget install does not find its bundled identify data' }
          # Control: the same binary without the share tree beside it reports
          # none, so the count above comes from the zip's identify data.
          $lone = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'lone-binary')
          Copy-Item $command.Source $lone
          if ((Get-InstalledPackCount (Join-Path $lone 'rom-weaver.exe')) -ne 0) {
            throw 'a lone binary also reports installed packs; the check proves nothing'
          }

          winget uninstall --id RomWeaver.RomWeaver --disable-interactivity --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "winget uninstall exited with $LASTEXITCODE" }
          if (Test-Path -LiteralPath $command.Source) { throw "uninstall left $($command.Source)" }
