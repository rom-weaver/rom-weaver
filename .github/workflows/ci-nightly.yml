name: Nightly build coverage

# The required PR gate keeps a representative native matrix and prebuilt image
# smokes. This scheduled workflow exercises every release target and both
# source Docker builders without making contributor feedback wait for them.
on:
  schedule:
    - cron: "31 07 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    name: Resolve release matrices
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.cli.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve CLI platform matrix
        id: cli
        run: node scripts/ci/cli-platform-matrix.mjs

  cli-platforms:
    name: CLI target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.cli) }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-cli-platform
        with:
          package: ${{ matrix.package }}
          target: ${{ matrix.target }}
          build: ${{ matrix.build }}
          binary: ${{ matrix.binary }}
          msvc-arch: ${{ matrix.msvc_arch }}
          msvc-host: ${{ matrix.msvc_host }}
          cache-save: "true"

      - name: Verify release CLI
        if: matrix.package != 'linux-arm64-musl'
        run: >-
          node scripts/verify-cli-platform.mjs
          target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload Linux arm64 CLI for native test
        if: matrix.package == 'linux-arm64-musl'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-cli-linux-arm64-musl
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

      - name: Verify platform package
        shell: bash
        run: >-
          npm pack --dry-run --ignore-scripts --json
          "packages/rom-weaver-cli-platforms/${{ matrix.package }}"

  cli-linux-arm64:
    name: CLI target runtime (aarch64-unknown-linux-musl)
    runs-on: ubuntu-24.04-arm
    needs: cli-platforms
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nightly-cli-linux-arm64-musl
          path: cli

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release CLI
        run: |
          chmod +x cli/rom-weaver
          node scripts/verify-cli-platform.mjs cli/rom-weaver

  docker-source:
    name: Docker source build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            image: rom-weaver-cli
            file: Dockerfile
          - name: webapp
            image: rom-weaver-webapp
            file: packages/rom-weaver-webapp/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build source image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:nightly-source-check
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
