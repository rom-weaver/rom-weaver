name: Cache cleanup

# Reclaim closed pull-request caches and restore-safe superseded generations
# before they evict main-branch caches from the 10 GiB budget. workflow_run
# uses this default-branch workflow, never a pull request's workflow code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # GitHub can delay workflow_run delivery. This is the fallback for that case.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Reap stale caches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Do not use workflow_run.head_sha: a CI run from a pull request can name
      # untrusted code. The branch filter and this ref keep the writer trusted.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete stale Actions caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/cache-cleanup.mjs
