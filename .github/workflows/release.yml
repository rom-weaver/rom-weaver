name: Release

on:
  # Opening or refreshing a release pull request is a deliberate action.
  # This workflow MUST NOT run on every main push: each release-branch update starts a full CI matrix.
  workflow_dispatch:
    inputs:
      release_as:
        description: Version to release as (e.g. 0.9.0, 0.9.0-alpha.1). Blank = computed from the commits.
        required: false
        type: string
      # Written by whoever dispatches the run (the `/release` skill drafts them
      # from the commits since the last tag). Blank keeps the highlights an
      # earlier dispatch stored on the release pull request.
      highlights:
        description: Markdown release highlights with subsection headings and bullets. Blank = keep the ones already on the release PR.
        required: false
        type: string
  # A merged release PR has passed required checks, so its close event creates the draft release.
  pull_request:
    types: [closed]

# Both paths force-push the release pull request branch, so they must never
# overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A dispatched release MUST target a commit with a successful main CI run.
  # Check the exact SHA because main can advance while this workflow waits.
  verify-main-ci:
    name: Verify main CI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for successful main CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in {1..360}; do
            response=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$TARGET_SHA&per_page=100")
            IFS=$'\t' read -r run_state conclusion url <<< "$(
              jq --arg sha "$TARGET_SHA" -r '[.workflow_runs[] | select(.head_branch == "main" and .head_sha == $sha and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | last // {} | [.status // "", .conclusion // "", .html_url // ""] | @tsv' <<< "$response"
            )"

            if [[ "$run_state" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                echo "CI passed for $TARGET_SHA: $url"
                exit 0
              fi
              echo "::error::CI for $TARGET_SHA concluded $conclusion: $url"
              exit 1
            fi

            if [[ -n "$run_state" ]]; then
              echo "CI for $TARGET_SHA is $run_state; waiting"
            else
              echo "No main CI run found for $TARGET_SHA; waiting"
            fi
            sleep 30
          done

          echo "::error::Timed out waiting for CI for $TARGET_SHA"
          exit 1

  release:
    needs: verify-main-ci
    if: >-
      always() &&
      (
        github.event_name != 'workflow_dispatch' ||
        needs.verify-main-ci.result == 'success'
      ) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-please--branches--main--components--')
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      # `gh attestation verify` reads the signed provenance of the reused WASM artifact.
      attestations: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      # For merged release PRs, release-please reports the merge commit rather than the PR head.
      sha: ${{ steps.release.outputs.sha }}
      artifact_sha: ${{ steps.artifact-sha.outputs.sha }}
      # The merged release pull request into main whose CI built `artifact_sha`, or empty. The CLI
      # binaries and the WASM module are reused only when attested by this pull request's CI run.
      artifact_pr: ${{ steps.artifact-sha.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          skip-github-pull-request: ${{ github.event_name == 'pull_request' }}
          # Release Please creates releases only for merged, untagged release commits.
          # An empty pull-request input uses Release Please's commit-derived version.
          release-as: ${{ inputs.release_as }}

      - name: Resolve reusable artifact commit
        id: artifact-sha
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          artifact_sha="$RELEASE_SHA"
          artifact_pr=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$PR_HEAD_SHA" ]]; then
            release_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$RELEASE_SHA" --jq .tree.sha)
            head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PR_HEAD_SHA" --jq .tree.sha)
            if [[ "$release_tree" == "$head_tree" ]]; then
              artifact_sha="$PR_HEAD_SHA"
              if [[ "$PR_BASE" == main && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then artifact_pr="$PR_NUMBER"; fi
            else
              echo "Release and pull request trees differ; requiring a release-commit artifact"
            fi
          fi
          echo "sha=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$artifact_pr" >> "$GITHUB_OUTPUT"

      - name: Mark GitHub prerelease
        if: >-
          steps.release.outputs.release_created == 'true' &&
          contains(steps.release.outputs.version, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ steps.release.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease

      # Refresh an existing release pull request even when Release Please made no new one.
      # Prefer the pull request Release Please reports, because the label filter goes through
      # GitHub search, which can miss one created seconds earlier; pass only its number and branch.
      - name: Find release pull request
        id: release-pr
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPORTED_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
          REPORTED_BRANCH: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
        shell: bash
        run: |
          set -euo pipefail
          number="$REPORTED_NUMBER"
          branch="$REPORTED_BRANCH"
          if [ -z "$number" ]; then
            read -r number branch < <(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --state open \
                --label 'autorelease: pending' \
                --json number,headRefName \
                --jq '.[0] | [.number, .headRefName] | @tsv'
            ) || true
          fi
          if [ -z "${number:-}" ] || [ -z "${branch:-}" ]; then
            echo "No open release pull request - nothing to sync"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "number=$number"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release pull request
        if: steps.release-pr.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # The commits below stay local until "Push release pull request commits". Every push to the
      # release branch starts a full CI run, so pushing each commit as it is made started runs that
      # the next push cancelled; the replacing run then waited for the cancelled one to finish.
      - name: Sync generated release metadata
        if: steps.release-pr.outputs.found == 'true'
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo "Generated release metadata is already current"
            exit 0
          fi
          git commit -m "chore(release): sync generated metadata"

      # Lays the section out as highlights plus a collapsed full list, folds
      # prerelease sections into a stable one, and mirrors the result into the
      # pull request body - which is what Release Please copies into the GitHub
      # release when the pull request merges.
      - name: Aggregate release changelog
        if: steps.release-pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release-pr.outputs.number }}
          RELEASE_HIGHLIGHTS: ${{ inputs.highlights }}
        run: node scripts/aggregate-release-changelog.mjs

      # Commit screenshots to the release pull request and reuse its tested WASM artifact.
      # The fallback covers a successful CI run that skipped the WASM build.
      - name: Set up screenshot capture
        if: steps.release-pr.outputs.found == 'true'
        uses: ./.github/actions/setup-build-env
        with:
          tools: node
          apt-packages: imagemagick ffmpeg libarchive-tools
          cargo-cache: "false"
          cache-save: "false"
          webapp-deps: "true"
          # Without the packs the production build below rebuilds all of them from
          # the Libretro and OpenGood archives (about 2.5 minutes). main's CI keeps
          # one entry per pack revision, and the restored packs are byte-identical.
          identify-data-cache: "true"

      - name: Resolve tested WASM artifact for screenshots
        if: steps.release-pr.outputs.found == 'true'
        id: screenshot-ci
        env:
          GH_TOKEN: ${{ github.token }}
          # Resolve the artifact from the dispatch commit's successful CI run.
          # The checkout now points at the release branch, which can have a different SHA.
          TARGET_SHA: ${{ github.sha }}
        run: node scripts/ci/resolve-wasm-run.mjs

      # Installs the artifact only if its signed provenance checks out; otherwise it installs
      # nothing and the fallback build below runs.
      - name: Verify and install tested WASM artifact for screenshots
        id: screenshot-wasm
        if: >-
          steps.release-pr.outputs.found == 'true' &&
          steps.screenshot-ci.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ steps.screenshot-ci.outputs.run_ids }}
          # The dispatch commit: its own push run signed the artifact.
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/ci/fetch-verified-wasm.mjs

      - name: Set up fallback WASM build for screenshots
        if: >-
          steps.release-pr.outputs.found == 'true' &&
          steps.screenshot-wasm.outputs.verified != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          tools: node rust binaryen
          apt-packages: cmake ninja-build pkg-config clang libclang-dev
          rust-targets: wasm32-wasip1-threads
          wasi-sdk: "true"
          cache-save: "false"

      - name: Build fallback WASM for screenshots
        if: >-
          steps.release-pr.outputs.found == 'true' &&
          steps.screenshot-wasm.outputs.verified != 'true'
        run: mise run build-wasm-prod

      - name: Verify WASM for screenshots
        if: steps.release-pr.outputs.found == 'true'
        run: node scripts/wasm/verify-wasm-artifact.mjs packages/rom-weaver-webapp/src/wasm

      # The build's ensure-emulatorjs step hash-checks every vendored file
      # against the lock, so a restored cache skips the CDN fetch.
      - name: Cache EmulatorJS vendor drop
        if: steps.release-pr.outputs.found == 'true'
        uses: actions/cache@v6
        with:
          path: packages/rom-weaver-webapp/vendor/emulatorjs/data
          key: emulatorjs-${{ hashFiles('packages/rom-weaver-webapp/vendor/emulatorjs.lock.json') }}

      - name: Build production webapp for docs screenshots
        if: steps.release-pr.outputs.found == 'true'
        env:
          ROM_WEAVER_CHANNEL: prod
          ROM_WEAVER_SYSTEM_CHROME: "1"
        run: npm --prefix packages/rom-weaver-webapp run build

      # capture:screenshots loads first-weave.zip and the first-create sample
      # assets, so the published guides show reproducible, copyright-safe data.
      - name: Capture docs screenshots from bundled samples
        id: screenshot-capture
        if: steps.release-pr.outputs.found == 'true'
        env:
          ROM_WEAVER_SYSTEM_CHROME: "1"
        run: |
          set -euo pipefail
          node packages/rom-weaver-webapp/scripts/dev-server.mjs preview --port 4173 > screenshot-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error --insecure --output /dev/null https://localhost:4173/; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat screenshot-server.log
            exit 1
          fi
          npm --prefix packages/rom-weaver-webapp run capture:screenshots
          npm --prefix packages/rom-weaver-webapp run capture:video

      - name: Upload screenshot failure diagnostics
        if: failure() && steps.screenshot-capture.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-failure-diagnostics
          overwrite: true
          include-hidden-files: true
          path: |
            docs/screenshots/*-failure.png
            screenshot-server.log
            .cache/agents/scratch/release-video/
          retention-days: 7
          if-no-files-found: warn

      - name: Publish README apply video
        if: steps.release-pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: node scripts/ci/publish-apply-video.mjs

      - name: Commit docs screenshots
        if: steps.release-pr.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node --input-type=module -e '
            import { DOCS_SCREENSHOT_NAMES } from "./packages/rom-weaver-webapp/scripts/docs-screenshot-manifest.mjs";
            for (const name of DOCS_SCREENSHOT_NAMES) process.stdout.write("docs/screenshots/" + name + "\0");
          ' | xargs -0 git add --
          # The capture rewrites screenshot width and height in the docs markup.
          git add -u -- README.md docs
          if git diff --cached --quiet; then
            echo "Release screenshots are already current"
            exit 0
          fi
          git commit -m "docs(screenshots): refresh release captures"

      # One push for every commit this job made. It also runs after a failed capture, so the
      # metadata and changelog commits still reach the pull request as they did when each was
      # pushed on its own. Nothing is pushed when the job made no commit.
      - name: Push release pull request commits
        if: ${{ !cancelled() && steps.release-pr.outputs.found == 'true' }}
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/heads/$RELEASE_PR_BRANCH"
          if [ -z "$(git rev-list FETCH_HEAD..HEAD)" ]; then
            echo "No new release pull request commits to push."
            exit 0
          fi
          git push origin "HEAD:$RELEASE_PR_BRANCH"

  # The crates to check, one matrix leg each. Listing them here keeps a newly published crate
  # from slipping past the semver gate. When every crate's bump allows breaking changes (a 0.x minor
  # or a major bump) the matrix is empty and `skipped` is true: cargo-semver-checks would skip every
  # lint for such a bump after spending most of the job building rustdoc. A patch release, a failed
  # or missing baseline lookup, or any other ambiguity keeps the check running. A failure here fails
  # the job, which the publish gates below do not accept as a skip.
  semver-plan:
    name: Plan breaking API checks
    needs: release
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
      skipped: ${{ steps.plan.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: List published workspace crates and decide which need a check
        id: plan
        env:
          CRATES_IO_USER_AGENT: rom-weaver-release-workflow (https://github.com/${{ github.repository }})
        run: node scripts/ci/semver-plan.mjs

  # Gate draft publication on semver checks so a failure leaves a deletable draft. A job that
  # needs this one accepts it as passed only when it succeeded or semver-plan skipped it on
  # purpose: see the `semver-check` condition repeated in each publishing job.
  # `!cancelled()` prevents a skipped verify-main-ci dependency from skipping this fan-out.
  # Each crate builds the rustdoc of its current and published versions, which took 13 minutes
  # for all five in one job; separate runners make the slowest crate the whole cost.
  semver-check:
    name: Check for breaking API changes (${{ matrix.crate }})
    needs: [release, semver-plan]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.semver-plan.result == 'success' &&
      needs.semver-plan.outputs.skipped != 'true' &&
      needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Cache reservation requires Actions write access.
      actions: write
    strategy:
      fail-fast: false
      # The org runs at most 20 jobs at once, and a release already peaks near
      # 16 with main's CI on the merge commit alongside. Two legs at a time keep
      # the per-crate split to one extra runner.
      max-parallel: 2
      matrix:
        crate: ${{ fromJSON(needs.semver-plan.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install build dependencies
        env:
          APT_PACKAGES: clang cmake libclang-dev ninja-build pkg-config
        run: node scripts/ci/install-system-dependencies.mjs

      - name: Prepare ROM identify data
        uses: ./.github/actions/identify-data

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-publish
          cache-on-failure: true

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      # Cache published rustdoc baselines, which change only when a crate is released.
      - name: Cache cargo-semver-checks baselines
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-semver-checks
          key: semver-checks-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            semver-checks-${{ runner.os }}-${{ matrix.crate }}-

      - name: Check for accidental breaking API changes
        shell: bash
        # cargo-semver-checks compares the crate with its latest crates.io release. A crate with no
        # published release has no baseline to fail against.
        run: |
          lookup_failed=0
          status=$(curl --silent --retry 3 --retry-all-errors --fail \
            --output /dev/null --write-out '%{http_code}' \
            --user-agent "$CRATES_IO_USER_AGENT" \
            "https://crates.io/api/v1/crates/$CRATE") || lookup_failed=1
          if [[ "$status" = 404 ]]; then
            echo "::notice::$CRATE has no published baseline yet - skipping semver check"
            exit 0
          fi
          if [[ "$status" != 200 || "$lookup_failed" != 0 ]]; then
            echo "::error::$CRATE baseline lookup failed (HTTP $status)"
            exit 1
          fi
          cargo semver-checks check-release --package "$CRATE"
        env:
          CRATE: ${{ matrix.crate }}
          CRATES_IO_USER_AGENT: rom-weaver-release-workflow (https://github.com/${{ github.repository }})

  cargo-publish-dry-run:
    name: Dry-run Cargo publish
    needs: release
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare ROM identify data
        uses: ./.github/actions/identify-data

      - name: Dry-run publish workspace crates
        # Package without uploading or credentials.
        # Skip verification because same-version workspace dependencies can still resolve to the previous registry graph.
        run: cargo publish --workspace --locked --dry-run --no-verify --allow-dirty

      - name: Check packaged crates include their embedded files
        # Check the packaged files because cargo verification is skipped above.
        run: node scripts/ci/check-package-includes.mjs

  # Package the static site beside the registry publishes rather than making all
  # of them wait for another production WASM build. The release PR head's CI
  # artifact is reused when its tree matches; otherwise build from release source.
  static-webapp:
    name: Package static webapp
    needs: release
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      # Checking that the release pull request whose WASM artifact is reused was merged.
      pull-requests: read
      # Signed provenance for the tarball, matching the platform binaries and
      # the container images.
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      # The release is still a draft here, so its tag does not exist yet - check
      # out the commit release-please released instead.
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Resolve tested WASM artifact
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.release.outputs.artifact_sha }}
          PR_NUMBER: ${{ needs.release.outputs.artifact_pr }}
        # Only a push or manual run of main, or the merged release PR's own run, is a candidate; the next
        # step verifies its signature. Any failure falls back to a source build.
        run: node scripts/ci/resolve-wasm-run.mjs

      - name: Set up static webapp build
        uses: ./.github/actions/setup-build-env
        with:
          tools: node
          cargo-cache: "false"
          cache-save: "false"
          webapp-deps: "true"
          # Same reason as the screenshot build: restore the packs instead of rebuilding them.
          identify-data-cache: "true"

      # Installs the artifact only if its signed provenance checks out and the signed source
      # tree equals the released commit's tree; otherwise it installs nothing and the fallback
      # build below runs.
      - name: Verify and install tested WASM artifact
        id: wasm
        if: steps.ci.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ steps.ci.outputs.run_ids }}
          PR_NUMBER: ${{ needs.release.outputs.artifact_pr }}
          EXPECTED_SHA: ${{ needs.release.outputs.sha }}
        run: node scripts/ci/fetch-verified-wasm.mjs

      - name: Set up fallback WASM build
        if: steps.wasm.outputs.verified != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          tools: node rust binaryen
          apt-packages: cmake ninja-build pkg-config clang libclang-dev
          rust-targets: wasm32-wasip1-threads
          wasi-sdk: "true"
          cache-save: "false"

      - name: Build fallback WASM artifact
        if: steps.wasm.outputs.verified != 'true'
        run: mise run build-wasm-prod

      - name: Verify WASM artifact
        run: node scripts/wasm/verify-wasm-artifact.mjs packages/rom-weaver-webapp/src/wasm

      # An unset channel builds as prod, which is right for a bare vX.Y.Z. A
      # prerelease has to be marked, though: its image and tarball would
      # otherwise claim production while the deploy ladder is putting the same
      # commit on beta.rom-weaver.com. Keyed off the hyphen, like the rest of
      # the prerelease routing (the GitHub prerelease flag, the npm dist-tag,
      # and the docker series tags). The label follows the channel on its own.
      # The build's ensure-emulatorjs step hash-checks every vendored file
      # against the lock, so a restored cache skips the CDN fetch.
      - name: Cache EmulatorJS vendor drop
        uses: actions/cache@v6
        with:
          path: packages/rom-weaver-webapp/vendor/emulatorjs/data
          key: emulatorjs-${{ hashFiles('packages/rom-weaver-webapp/vendor/emulatorjs.lock.json') }}

      - name: Package static webapp release asset
        env:
          ROM_WEAVER_CHANNEL: ${{ contains(needs.release.outputs.version, '-') && 'beta' || 'prod' }}
          ROM_WEAVER_SYSTEM_CHROME: "1"
        run: |
          npm --prefix packages/rom-weaver-webapp run build
          tar --create --gzip \
            --file rom-weaver-webapp.tar.gz \
            --directory packages/rom-weaver-webapp/dist .

      # Consumed by the webapp image, which would otherwise install rustup, the
      # WASI SDK and binaryen and rebuild the same bundle from scratch. Sharing
      # it also gives Docker the same precompressed assets as every other
      # webapp bundle.
      - name: Upload static webapp bundle for the container build
        uses: actions/upload-artifact@v7
        with:
          name: webapp-dist
          path: packages/rom-weaver-webapp/dist
          if-no-files-found: error
          # dist has no dot-prefixed entries today, but upload-artifact drops
          # them silently by default - the day a `.well-known/` lands there the
          # tarball would keep it and the container would not, which is exactly
          # the divergence sharing this artifact exists to remove.
          include-hidden-files: true
          # See the matching upload in npm-build.yml: an artifact name cannot
          # be reused within a run, so without this a rerun of a failed
          # static-webapp job 409s here instead of retrying.
          overwrite: true
          retention-days: 7

      - name: Upload static webapp release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" \
            rom-weaver-webapp.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Build provenance binds the tarball digest to this workflow run and source commit.
      # Attestations use the repository store, so they do not modify immutable release assets.
      - name: Attest the static webapp tarball
        uses: ./.github/actions/attest-retry
        with:
          subject-path: rom-weaver-webapp.tar.gz

  # Builds, dry-runs and packages everything the npm publish needs, beside the semver check rather than
  # after it: nothing here writes to a registry or publishes the draft, so only publish-npm waits
  # for the check. Waits for the cargo dry-run, which finishes in under a minute, so a package
  # crates.io would reject fails before any macOS or Windows runner is spent, and the nine builds
  # start after main's CI first wave has thinned.
  #
  # The build count keeps the release window at the 16 jobs it peaked at before (the org runs at most
  # 20 at once): five at a time beside static-webapp when the semver check is skipped, three beside
  # its two legs when it runs.
  npm-build:
    needs: [release, semver-plan, cargo-publish-dry-run]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.release.outputs.release_created == 'true' &&
      needs.semver-plan.result == 'success' &&
      needs.cargo-publish-dry-run.result == 'success'
    permissions:
      # The identify data and CLI documentation are attached to the draft and attested here,
      # and a reusable workflow receives the calling job's token and never more.
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      # Finding and downloading the release pull request run's CLI binaries, after checking that
      # pull request was merged.
      actions: read
      pull-requests: read
    uses: ./.github/workflows/npm-build.yml
    with:
      version: ${{ needs.release.outputs.version }}
      sha: ${{ needs.release.outputs.sha }}
      artifact-sha: ${{ needs.release.outputs.artifact_sha }}
      artifact-pr: ${{ needs.release.outputs.artifact_pr }}
      cache-save: false
      build-parallel: ${{ needs.semver-plan.outputs.skipped == 'true' && 5 || 3 }}

  emulator-runtime:
    name: Build emulator runtime
    needs: release
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/emulator-runtime.yml
    with:
      sha: ${{ needs.release.outputs.sha }}

  publish-emulator-runtime:
    name: Publish emulator runtime
    needs: [release, emulator-runtime]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.emulator-runtime.result == 'success' &&
      needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Download emulator runtime
        uses: actions/download-artifact@v8
        with:
          name: emulator-runtime-linux-x64-gnu
          path: target/emulator-release

      - name: Upload emulator runtime release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" \
            target/emulator-release/rom-weaver-emulator-linux-x64-gnu.tar.gz \
            target/emulator-release/rom-weaver-emulator-linux-x64-gnu.tar.gz.sha256 \
            target/emulator-release/rom-weaver-emulator-sources.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attest emulator runtime archives
        uses: ./.github/actions/attest-retry
        with:
          subject-path: target/emulator-release/*.tar.gz

  # The only npm job that writes to a registry, so it is the one that waits for the semver check.
  publish-npm:
    needs: [release, semver-plan, semver-check, cargo-publish-dry-run, npm-build]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.release.outputs.release_created == 'true' &&
      needs.cargo-publish-dry-run.result == 'success' &&
      needs.npm-build.result == 'success' &&
      (
        needs.semver-check.result == 'success' ||
        (
          needs.semver-check.result == 'skipped' &&
          needs.semver-plan.result == 'success' &&
          needs.semver-plan.outputs.skipped == 'true'
        )
      )
    permissions:
      contents: write
      id-token: write
      # A reusable workflow receives the calling job's token and never more, so
      # the attestation grants in npm-publish.yml are capped here. Without these
      # the attest step 403s at the very end of an otherwise successful publish.
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      sha: ${{ needs.release.outputs.sha }}
      platforms: ${{ needs.npm-build.outputs.platforms }}
    secrets:
      NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

  # After publish-release, not before: the formula points at
  # releases/download/vX.Y.Z/... and a draft's assets are not publicly
  # downloadable, so pushing it earlier put a live formula in the tap whose URLs
  # 404 until the draft is published. This is also the safer half of the
  # tradeoff it costs - a failed formula push no longer holds the draft, and it
  # is the one publish in the fan-out that is trivially retryable, being a git
  # push to a repository we own rather than an irreversible registry write.
  publish-homebrew:
    needs: [release, publish-release]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.publish-release.result == 'success' &&
      needs.release.outputs.release_created == 'true' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      # The formula must hash the exact published bytes, and a tar.gz built
      # here would not reproduce them (tar member metadata and gzip headers
      # differ run to run), so the archives are downloaded from the release
      # rather than rebuilt from the platform artifacts. This job runs after
      # publish-release, so the assets are publicly downloadable.
      - name: Calculate release checksums
        run: |
          set -euo pipefail
          mkdir checksums
          for platform in darwin-arm64 darwin-x64 linux-arm64-musl linux-x64-gnu; do
            asset="rom-weaver-$platform.tar.gz"
            curl --fail --location --retry 5 --retry-delay 2 --output "$asset" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ needs.release.outputs.version }}/$asset"
            printf '%s  %s\n' "$(sha256sum "$asset" | cut -d ' ' -f 1)" "$asset" > \
              "checksums/$asset.sha256"
          done
          curl --fail --location --retry 5 --retry-delay 2 --output rom-weaver-cli-assets.tar.gz \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ needs.release.outputs.version }}/rom-weaver-cli-assets.tar.gz"
          printf '%s  rom-weaver-cli-assets.tar.gz\n' \
            "$(sha256sum rom-weaver-cli-assets.tar.gz | cut -d ' ' -f 1)" > \
            checksums/rom-weaver-cli-assets.tar.gz.sha256
          curl --fail --location --retry 5 --retry-delay 2 --output rom-weaver-identify-data.tar.br \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ needs.release.outputs.version }}/rom-weaver-identify-data.tar.br"
          printf '%s  rom-weaver-identify-data.tar.br\n' \
            "$(sha256sum rom-weaver-identify-data.tar.br | cut -d ' ' -f 1)" > \
            checksums/rom-weaver-identify-data.tar.br.sha256
          curl --fail --location --retry 5 --retry-delay 2 --output rom-weaver-cli-assets.zip \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ needs.release.outputs.version }}/rom-weaver-cli-assets.zip"
          printf '%s  rom-weaver-cli-assets.zip\n' \
            "$(sha256sum rom-weaver-cli-assets.zip | cut -d ' ' -f 1)" > \
            checksums/rom-weaver-cli-assets.zip.sha256

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: rom-weaver/homebrew-tap
          token: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/generate-homebrew-formula.mjs "$VERSION" checksums homebrew-tap/Formula/rom-weaver.rb

      - name: Publish formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/rom-weaver.rb
          git diff --cached --quiet && exit 0
          git commit -m "rom-weaver $VERSION"
          git push

  # Windows counterpart to publish-homebrew, with the same ordering and the same
  # prerelease skip: a bucket has one manifest per package, so publishing a beta
  # there would hand it to every stable user.
  publish-scoop:
    needs: [release, publish-release]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.publish-release.result == 'success' &&
      needs.release.outputs.release_created == 'true' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      # Same rationale as publish-homebrew: hash the published archives, which
      # cannot be reproduced from the platform artifacts.
      - name: Calculate release checksums
        run: |
          set -euo pipefail
          mkdir checksums
          for platform in win32-arm64-msvc win32-ia32-msvc win32-x64-msvc; do
            asset="rom-weaver-$platform.tar.gz"
            curl --fail --location --retry 5 --retry-delay 2 --output "$asset" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ needs.release.outputs.version }}/$asset"
            printf '%s  %s\n' "$(sha256sum "$asset" | cut -d ' ' -f 1)" "$asset" > \
              "checksums/$asset.sha256"
          done
          for asset in rom-weaver-identify-data.tar.br rom-weaver-cli-assets.zip; do
            curl --fail --location --retry 5 --retry-delay 2 --output "$asset" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ needs.release.outputs.version }}/$asset"
            printf '%s  %s\n' "$(sha256sum "$asset" | cut -d ' ' -f 1)" "$asset" > \
              "checksums/$asset.sha256"
          done

      - name: Checkout Scoop bucket
        uses: actions/checkout@v7
        with:
          repository: rom-weaver/scoop-bucket
          token: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
          path: scoop-bucket

      - name: Update manifest
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/generate-scoop-manifest.mjs "$VERSION" checksums scoop-bucket/bucket/rom-weaver.json

      - name: Publish manifest
        working-directory: scoop-bucket
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bucket/rom-weaver.json
          git diff --cached --quiet && exit 0
          git commit -m "rom-weaver $VERSION"
          git push

  # Both images are assembled from artifacts static-webapp and npm-build produce, so the build waits
  # for those two and then runs beside the npm publish instead of after it. It pushes nothing: each
  # architecture is written to an OCI archive, and publish-containers pushes the archives (and
  # assembles the manifest lists) only after the gates below. The serialization the prebuilt
  # artifacts cost is bought back several times over: the webapp image no longer builds a toolchain
  # and a wasm module of its own, and the CLI image no longer compiles the workspace.
  # docker-publish falls back to building from source if either artifact is missing, which is what
  # a standalone workflow_dispatch gets.
  build-containers:
    needs: [release, static-webapp, npm-build]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.static-webapp.result == 'success' &&
      needs.npm-build.result == 'success' &&
      needs.release.outputs.release_created == 'true'
    # GitHub rejects the whole run at startup when a called workflow's job, even one its `if` skips,
    # asks for more than the caller grants, so this grants what docker-publish.yml's `publish` job
    # asks for. The `build` job, the only one this phase runs, narrows its own token to read access,
    # so the build still cannot write to the registry.
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      sha: ${{ needs.release.outputs.sha }}
      phase: build

  publish-containers:
    needs: [release, semver-plan, semver-check, static-webapp, publish-npm, build-containers]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.static-webapp.result == 'success' &&
      needs.publish-npm.result == 'success' &&
      needs.build-containers.result == 'success' &&
      (
        needs.semver-check.result == 'success' ||
        (
          needs.semver-check.result == 'skipped' &&
          needs.semver-plan.result == 'success' &&
          needs.semver-plan.outputs.skipped == 'true'
        )
      ) &&
      needs.release.outputs.release_created == 'true'
    permissions:
      # Belt and braces for the artifact download in docker-publish.yml. A
      # same-run download authenticates with the runner's ACTIONS_RUNTIME_TOKEN
      # rather than GITHUB_TOKEN, so this is not believed to be load-bearing
      # today - but a reusable workflow gets the caller job's token and never
      # more, so if that ever changes the grant has to exist in both places or
      # the download fails and the images cannot be pushed.
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      sha: ${{ needs.release.outputs.sha }}
      phase: publish

  # Publishing the draft is what creates the tag and stamps the release
  # immutable, so every job that attaches an asset has to come first: assets can
  # only be attached while the release is still a draft. A failure in any of
  # them leaves the draft in place, which is deletable and frees the version to
  # be cut again - a published immutable release permanently reserves its tag
  # name. Creating the tag here is also what triggers cargo-publish.yml.
  #
  # publish-homebrew and publish-scoop deliberately run *after* this rather than
  # gating it; see the comment on publish-homebrew.
  publish-release:
    name: Publish draft release
    needs:
      [
        release,
        semver-plan,
        semver-check,
        cargo-publish-dry-run,
        static-webapp,
        publish-npm,
        publish-containers,
        publish-emulator-runtime,
      ]
    if: >-
      always() &&
      needs.release.outputs.release_created == 'true' &&
      (
        needs.semver-check.result == 'success' ||
        (
          needs.semver-check.result == 'skipped' &&
          needs.semver-plan.result == 'success' &&
          needs.semver-plan.outputs.skipped == 'true'
        )
      ) &&
      needs.cargo-publish-dry-run.result == 'success' &&
      needs.static-webapp.result == 'success' &&
      needs.publish-npm.result == 'success' &&
      needs.publish-containers.result == 'success' &&
      needs.publish-emulator-runtime.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Deliberately not github.token: a tag push made with GITHUB_TOKEN does not
      # start new workflow runs, so cargo-publish.yml would never fire.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release edit "v${{ needs.release.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
