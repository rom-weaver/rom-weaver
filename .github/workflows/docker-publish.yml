name: Publish Docker images

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      sha:
        description: >-
          Commit to build from. The release tag does not exist while the release
          is still a draft, and github.ref points at main, which may already
          have moved past the released commit.
        required: true
        type: string
      phase:
        description: >-
          `build` writes the four single-architecture images to OCI archives and pushes nothing, so
          it can run before the release gates pass; `publish` pushes those archives and assembles the
          manifest lists; `all` does both in order.
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

concurrency:
  group: docker-publish-${{ inputs.version || github.ref_name }}-${{ inputs.phase || 'all' }}
  cancel-in-progress: false

# Each job asks for what it needs: the build phase can run before the release gates pass, so it
# holds no write access to the registry or the attestation store.
permissions:
  contents: read

jobs:
  # Build each image architecture natively into an OCI archive, then (in `publish`) push the archives
  # by digest and join them into one manifest list. Nothing here is pushed to a registry, so the
  # release can run this beside the npm publish and still push only after every gate has passed.
  build:
    name: Build ${{ matrix.name }} image (${{ matrix.arch }})
    if: inputs.phase != 'publish'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      # Read the run artifacts the npm and static-webapp jobs published, and the layer cache.
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # Two at a time keeps the release window at the 16 jobs it peaked at (the org runs at most 20)
      # while the nine npm packages publish beside these. The webapp legs are the slow pair and the
      # whole phase still ends before the npm publish does.
      max-parallel: 2
      matrix:
        include:
          # `build_arg` selects the Dockerfile stage; `artifact` names its prebuilt input.
          - name: CLI
            image: rom-weaver-cli
            file: Dockerfile
            build_arg: BINARY
            arch: amd64
            runner: ubuntu-24.04
            artifact: cli-binary-linux-x64-gnu
            prebuilt_path: prebuilt/amd64
          - name: CLI
            image: rom-weaver-cli
            file: Dockerfile
            build_arg: BINARY
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: cli-binary-linux-arm64-musl
            prebuilt_path: prebuilt/arm64
          - name: webapp
            image: rom-weaver-webapp
            file: packages/rom-weaver-webapp/Dockerfile
            build_arg: DIST
            arch: amd64
            runner: ubuntu-24.04
            artifact: webapp-dist
            prebuilt_path: prebuilt
          - name: webapp
            image: rom-weaver-webapp
            file: packages/rom-weaver-webapp/Dockerfile
            build_arg: DIST
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: webapp-dist
            prebuilt_path: prebuilt
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      # Reuse artifacts from the release commit so images contain the tested release bytes.
      # Manual dispatches and individual missing artifacts fall back to source builds.
      - name: Download prebuilt artifact
        id: prebuilt
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.prebuilt_path }}

      - name: Download identify data
        id: identify-data
        if: matrix.name == 'CLI'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: identify-release-data
          path: target

      - name: Download CLI documentation
        id: docs
        if: matrix.name == 'CLI'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: cli-assets
          path: .tmp/cli-assets

      - name: Extract CLI documentation
        if: matrix.name == 'CLI' && steps.docs.outcome == 'success'
        run: tar --extract --gzip --file .tmp/cli-assets/rom-weaver-cli-assets.tar.gz --directory docs

      # The fallback is correct but slow, and it is otherwise invisible - a
      # release that quietly went back to compiling everything should say so.
      - name: Resolve build source
        id: source
        env:
          ARTIFACT: ${{ matrix.artifact }}
          ARCH: ${{ matrix.arch }}
          # `sha` is supplied only by the release fan-out, and a reusable
          # workflow inherits its caller's event - so github.event_name cannot
          # tell the two entry points apart, but this can.
          EXPECTED: ${{ inputs.sha != '' }}
          NAME: ${{ matrix.name }}
          OUTCOME: ${{ steps.prebuilt.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            value=prebuilt
          else
            value=source
            if [ "$EXPECTED" = true ]; then
              echo "::warning::no ${ARTIFACT} artifact; rebuilding the ${NAME} ${ARCH} image from source"
            fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "building the ${NAME} ${ARCH} image from ${value}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag policy
        id: policy
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/ci/docker-tag-policy.mjs

      # Consumed for its labels only - `org.opencontainers.image.version` is
      # taken from the primary tag, so the version still has to be right here.
      # Which tags the image answers to is decided once, by the manifest list
      # `publish` assembles; these legs are pushed by digest and claim none.
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=semver,pattern={{version}},value=${{ steps.policy.outputs.version }}

      # The archive keeps the image's provenance and SBOM attestations; the `publish` job pushes it
      # unchanged, so the digest is the one recorded here. Registry cache export writes to the
      # registry, so it is limited to a standalone dispatch (no `sha`), which has no gate to wait for.
      - name: Build image archive
        uses: ./.github/actions/docker-build-arch
        with:
          image: ${{ matrix.image }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.build_arg }}=${{ steps.source.outputs.value }}
            IDENTIFY_DATA=${{ matrix.name == 'CLI' && steps.identify-data.outcome == 'success' && 'prebuilt' || 'source' }}
            DOCS=${{ matrix.name == 'CLI' && steps.docs.outcome == 'success' && 'prebuilt' || 'source' }}
          labels: ${{ steps.metadata.outputs.labels }}
          arch: ${{ matrix.arch }}
          registry-owner: ${{ github.repository_owner }}
          export-oci: ${{ runner.temp }}/image.tar
          # Export only source-build layers so prebuilt COPY layers do not replace the useful cache.
          cache-to: ${{ steps.source.outputs.value == 'source' && inputs.sha == '' }}

      # Layers are already compressed, so storing the archive uncompressed saves the CPU time.
      - name: Upload image archive
        uses: actions/upload-artifact@v7
        with:
          name: docker-oci-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          # As long as the platform packages the npm publish retries from: a failed publish-containers
          # rerun pushes these archives rather than rebuilding them.
          retention-days: 7

  publish:
    name: Publish ${{ matrix.name }} image
    # `build` is skipped when only this phase runs; a failed or cancelled build must still stop it.
    if: >-
      !cancelled() && inputs.phase != 'build' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    permissions:
      # Read the image archives the build phase uploaded.
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            image: rom-weaver-cli
          - name: webapp
            image: rom-weaver-webapp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Normalizes the version (tags arrive as `v0.6.0`, workflow_dispatch as
      # `0.6.0`) and decides which moving tags are safe for this version.
      - name: Resolve tag policy
        id: policy
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/ci/docker-tag-policy.mjs

      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # Prereleases never move `latest` or series tags. The moving tags follow the deploy channel ladder.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.policy.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.policy.outputs.version }},enable=${{ steps.policy.outputs.release == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.policy.outputs.version }},enable=${{ steps.policy.outputs.major_tag == 'true' }}
            type=raw,value=latest,enable=${{ steps.policy.outputs.release == 'true' }}
            type=raw,value=beta
            type=raw,value=nightly

      - name: Download the image archives
        uses: actions/download-artifact@v8
        with:
          pattern: docker-oci-${{ matrix.image }}-*
          path: ${{ runner.temp }}/oci

      # By digest, no tag: the same registry state `push-by-digest` produced when the build leg
      # pushed directly. `--all --preserve-digests` copies the attestation manifests and keeps
      # every digest, so the manifest list below joins exactly what each leg built.
      - name: Push the image archives by digest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          ARCHIVES: ${{ runner.temp }}/oci
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            APT_PACKAGES=skopeo node scripts/ci/install-system-dependencies.mjs
          fi
          # A missing leg would otherwise publish a manifest list advertising one architecture, so
          # count before anything is pushed.
          archives=("$ARCHIVES"/*/image.tar)
          if [ "${#archives[@]}" -ne 2 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::expected two image archives, found: ${archives[*]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            digest=$(tar -xOf "$archive" index.json | jq -er 'if (.manifests | length) == 1 then .manifests[0].digest else error("expected one manifest") end')
            skopeo copy --retry-times 3 --all --preserve-digests "oci-archive:$archive" "docker://$IMAGE@$digest"
            # The registry hashes what it stored; anything but the archive's digest is a bad push.
            test "sha256:$(skopeo inspect --raw "docker://$IMAGE@$digest" | sha256sum | cut -d ' ' -f 1)" = "$digest"
            echo "pushed $IMAGE@$digest from ${archive#"$ARCHIVES"/}"
          done

      - name: Assemble the manifest list
        id: manifest
        uses: ./.github/actions/docker-manifest
        with:
          image: ${{ matrix.image }}
          registry-owner: ${{ github.repository_owner }}
          tags: ${{ steps.metadata.outputs.tags }}

      # The manifest list, not either architecture's image: that is what a pull
      # of any of the tags above resolves against.
      - name: Sign build provenance
        uses: ./.github/actions/attest-retry
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
