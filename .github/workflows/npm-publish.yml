name: Publish npm CLI

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      sha:
        description: >-
          Commit to build from. The release tag does not exist while the release
          is still a draft, and github.ref points at main, which may already
          have moved past the released commit.
        required: true
        type: string
      cache-save:
        description: Save the Cargo cache after a miss.
        required: false
        default: false
        type: boolean
    secrets:
      NPM_BOOTSTRAP_TOKEN:
        description: One-time token for packages that cannot use trusted publishing yet.
        required: false
concurrency:
  group: npm-publish-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  identify-data:
    name: Package identify data
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install data build tools
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Build identify data archive
        run: |
          node scripts/ensure-identify-data.mjs
          node scripts/build-identify-release-data.mjs
      - name: Upload identify data artifact
        uses: actions/upload-artifact@v7
        with:
          name: identify-release-data
          path: |
            target/identify-release/share
            target/rom-weaver-identify-data*.tar.zst
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload identify data release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "v${{ inputs.version }}"
          target/rom-weaver-identify-data*.tar.zst
          --repo "$GITHUB_REPOSITORY" --clobber
      - name: Attest identify data archive
        uses: ./.github/actions/attest-retry
        with:
          subject-path: target/rom-weaver-identify-data*.tar.zst

  # The three matrices below all fan out over the same target list, and CI
  # builds it too. It lives in .github/cli-platforms.json; a matrix can only be
  # fed by an upstream job's output, so it is resolved once here.
  plan:
    name: Resolve platform matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      platforms: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - id: platforms
        run: node scripts/ci/cli-platform-matrix.mjs

  platform-build:
    name: Build ${{ matrix.package }}
    needs: [plan, identify-data]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - name: Download identify data
        uses: actions/download-artifact@v8
        with:
          name: identify-release-data
          path: target

      # Same action CI builds with, against the same per-platform cargo cache,
      # so a release restores what CI already built rather than compiling a
      # second, differently-configured copy.
      - uses: ./.github/actions/build-cli-platform
        with:
          package: ${{ matrix.package }}
          target: ${{ matrix.target }}
          build: ${{ matrix.build }}
          binary: ${{ matrix.binary }}
          msvc-arch: ${{ matrix.msvc_arch }}
          msvc-host: ${{ matrix.msvc_host }}
          cache-save: ${{ inputs.cache-save }}
          registry-url: https://registry.npmjs.org

      # Keep the compiled package outside the publish job. A failed npm or
      # release-asset step can then rerun without rebuilding Rust.
      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: npm-platform-${{ matrix.package }}
          path: packages/rom-weaver-cli-platforms/${{ matrix.package }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # The CLI image is multi-platform and consumes these exact binaries
      # rather than compiling the workspace a second time.
      - name: Upload Linux x64 binary for the container build
        if: matrix.package == 'linux-x64-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-linux-x64-gnu
          path: packages/rom-weaver-cli-platforms/linux-x64-gnu/bin/rom-weaver
          if-no-files-found: error
          # Artifact names are immutable within a run and a re-run shares the
          # run's namespace, so without this the documented "rerun the failed
          # jobs" retry (.github/RELEASING.md) would 409 here on every attempt
          # and strand the draft. A rerun rebuilds the same released sha, and
          # publish-containers was skipped in the failed attempt, so nothing can
          # be reading the artifact while it is replaced.
          overwrite: true
          retention-days: 7

      - name: Upload Linux arm64 binary for the container build
        if: matrix.package == 'linux-arm64-musl'
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-linux-arm64-musl
          path: packages/rom-weaver-cli-platforms/linux-arm64-musl/bin/rom-weaver
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  platform-dry-run:
    name: Dry-run publish ${{ matrix.package }}
    needs: [plan, platform-build]
    if: ${{ needs.platform-build.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    # `native_runner`, not `runner`: this leg executes the built binary, and
    # linux-arm64-musl cross-builds on x64 but can only run on arm64.
    runs-on: ${{ matrix.native_runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - name: Download platform package
        uses: actions/download-artifact@v8
        with:
          name: npm-platform-${{ matrix.package }}
          path: packages/rom-weaver-cli-platforms/${{ matrix.package }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install npm dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      # Runs the exact staged artifact the publish job will upload, on the
      # oldest OS this target supports - the only check that a newer build image
      # did not quietly raise the runtime floor. CI's own verify runs on the
      # *build* runner, so for Darwin it cannot see that regression at all.
      # Actions artifacts drop the executable bit; the publish helper restores it
      # before packing, but this step must not depend on running after it.
      - name: Verify release CLI
        shell: bash
        env:
          BINARY: packages/rom-weaver-cli-platforms/${{ matrix.package }}/bin/${{ matrix.binary }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == "Windows" ]] || chmod +x "$BINARY"
          node scripts/verify-cli-platform.mjs "$BINARY"

      - name: Dry-run platform package publish
        shell: bash
        run: node scripts/ci/npm-publish-package.mjs --dry-run packages/rom-weaver-cli-platforms/${{ matrix.package }}

  cli-assets:
    name: Package CLI documentation
    needs: platform-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev ninja-build pkg-config zip

      - name: Generate CLI documentation
        run: |
          node scripts/ensure-identify-data.mjs
          cargo run --locked -p rom-weaver-cli --example generate_manpages -- --write

      - name: Package CLI documentation
        run: |
          tar -czf rom-weaver-cli-assets.tar.gz -C docs man completions
          (cd docs && zip -qr ../rom-weaver-cli-assets.zip man completions)

      - name: Upload CLI documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-assets
          path: |
            rom-weaver-cli-assets.tar.gz
            rom-weaver-cli-assets.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload CLI documentation release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" rom-weaver-cli-assets.tar.gz rom-weaver-cli-assets.zip --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attest CLI documentation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: rom-weaver-cli-assets.tar.gz

      - name: Attest Windows CLI documentation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: rom-weaver-cli-assets.zip

  # A matrix dependency is a barrier over every matrix entry. No registry
  # publish starts unless all nine downloaded platform artifacts passed the
  # same publish helper in dry-run mode on their target operating systems.
  platform:
    name: Publish ${{ matrix.package }}
    needs: [plan, platform-dry-run]
    if: ${{ needs.platform-dry-run.result == 'success' }}
    permissions:
      contents: write
      id-token: write
      # Signed provenance for the release archive. npm generates its own for
      # the package from the same OIDC token; this covers the tar.gz asset,
      # which `install.sh`, Homebrew, and Scoop hand to users without going
      # near npm.
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    # Publishes the binary it just proved runs here, so the same native host as
    # the dry-run above.
    runs-on: ${{ matrix.native_runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - name: Download platform package
        uses: actions/download-artifact@v8
        with:
          name: npm-platform-${{ matrix.package }}
          path: packages/rom-weaver-cli-platforms/${{ matrix.package }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install npm dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Publish platform package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ matrix.bootstrap && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: |
          # ponytail: Set bootstrap: true only for an unpublished package, then
          # remove it after configuring that package's trusted publisher.
          if [[ "${{ matrix.bootstrap }}" == true && -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_BOOTSTRAP_TOKEN is required for first publication"
            exit 1
          fi
          node scripts/ci/npm-publish-package.mjs packages/rom-weaver-cli-platforms/${{ matrix.package }}

      # After the npm publish, not before: npm is the irreversible half, so a
      # release-asset failure must not be able to skip it.
      #
      # The asset is a tar.gz holding the single executable, not the loose
      # binary it used to be: cargo-binstall needs an archive layout to resolve,
      # and the compression roughly halves every installer's download. The
      # archive is what gets attested, so consumers verify the exact bytes they
      # fetched.
      - name: Upload platform archive to GitHub release
        id: asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_path=packages/rom-weaver-cli-platforms/${{ matrix.package }}
          binary_path="$package_path/bin/rom-weaver"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary_path+=".exe"
          fi
          # The artifact transfer strips the executable bit and the publish
          # step's helper restores it; the tar below records the on-disk mode
          # and Homebrew installs the member as-is. Fail here rather than ship
          # a 0644 binary if that ordering is ever broken.
          [[ "${{ runner.os }}" == "Windows" ]] || test -x "$binary_path"
          binary_name="$(basename "$binary_path")"
          asset_name="rom-weaver-${{ matrix.package }}.tar.gz"
          archive_dir="$(mktemp -d)"
          cp "$binary_path" "$archive_dir/$binary_name"
          tar --create --gzip --file "$asset_name" --directory "$archive_dir" "$binary_name"
          test "$(tar --list --file "$asset_name")" = "$binary_name"
          gh release upload "v${{ inputs.version }}" "$asset_name" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "name=$asset_name" >> "$GITHUB_OUTPUT"

      # This replaced the `.sha256` sidecar that used to ship beside each asset.
      # The sidecar was written by this same job, so it proved the download was
      # not corrupted and nothing about where the binary came from.
      #
      # Attestations live in the repository's attestation store, not in the
      # release's asset list, so this adds nothing to the draft and cannot
      # interact with immutable releases - it is safe on a rerun and safe after
      # the release is published.
      - name: Attest the release archive
        uses: ./.github/actions/attest-retry
        with:
          subject-path: ${{ steps.asset.outputs.name }}

  launcher:
    needs: [platform, cli-assets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install npm dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Add generated CLI documentation to launcher package
        uses: actions/download-artifact@v8
        with:
          name: cli-assets
          path: .tmp/cli-assets

      - name: Extract generated CLI documentation
        run: tar -xzf .tmp/cli-assets/rom-weaver-cli-assets.tar.gz -C docs

      - name: Publish launcher package
        run: node scripts/ci/npm-publish-package.mjs

  # The unscoped `rom-weaver` name is a dependency-only alias for
  # @rom-weaver/cli, so it must publish after the launcher it points at -
  # otherwise installs resolve a version that is not on the registry yet.
  alias:
    needs: launcher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || format('v{0}', inputs.version) }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install npm dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Publish alias package
        run: |
          cp LICENSE packages/rom-weaver-alias/LICENSE
          node scripts/ci/npm-publish-package.mjs packages/rom-weaver-alias
