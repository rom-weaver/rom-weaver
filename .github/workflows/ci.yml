name: CI

on:
  workflow_dispatch:
    inputs:
      deploy_channel:
        description: Also deploy the webapp to this channel (none = test only)
        required: false
        default: none
        type: choice
        options: [none, nightly, beta, prod]
  pull_request:
  push:
    branches:
      - main
    # Release tags deploy the webapp; the test jobs below skip them, since the
    # commit being tagged already passed this same gate on main.
    tags: ["v*"]

# Least privilege: most of this workflow only reads the repo. The deploy job
# widens its own permissions rather than granting them workflow-wide.
permissions:
  contents: read

# Superseded pushes to a branch are pointless work; on main every commit is a
# release candidate, so those runs are allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      webapp: ${{ steps.classify.outputs.webapp }}
      wasm_runtime: ${{ steps.classify.outputs.wasm_runtime }}
      security: ${{ steps.classify.outputs.security }}
      docker_matrix: ${{ steps.docker-matrix.outputs.matrix }}
      docker_prebuilt: ${{ steps.classify.outputs.docker_prebuilt }}
      repo_lint: ${{ steps.classify.outputs.repo_lint }}
      full: ${{ steps.classify.outputs.full }}
      # "Cover this ref the way a push to main is covered" - true for every
      # event but an ordinary pull request. The release pull request is the
      # exception among pull requests; scripts/ci/release-pr.mjs owns the rule.
      full_matrix: ${{ steps.classify.outputs.full_matrix }}
      cli_platforms: ${{ steps.cli-platforms.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A matrix can only be fed by an upstream job's output, so the shared
      # target list is resolved here rather than in the job that consumes it.
      # The event name narrows it to the pull-request subset; see the
      # `cli-platforms` job below.
      - name: Resolve CLI platform matrix
        id: cli-platforms
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/cli-platform-matrix.mjs

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          # Empty for anything that is not a pull request. It is what tells the
          # release pull request apart from a review one, which is the only case
          # where a pull request is not narrowed.
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/classify-workflow.mjs

      # The image table lives here rather than in the `docker` job below because
      # a matrix can only be fed by an upstream job's output, and an unselected
      # leg has to be absent from the matrix rather than started and skipped -
      # that is the whole saving. `[]` means neither image is selected; the job
      # guards on it, since an empty matrix is a hard error.
      #
      # The `_arm64` flags select each image's second architecture separately: a
      # pull request that changed only compile inputs builds amd64 alone, since
      # the arm64 leg is another full release compile that cannot fail for a
      # reason amd64 did not. Editing an image definition still builds both.
      - name: Plan the Docker image matrix
        id: docker-matrix
        env:
          CLI_SELECTED: ${{ steps.classify.outputs.docker_cli }}
          CLI_ARM64: ${{ steps.classify.outputs.docker_cli_arm64 }}
          WEBAPP_SELECTED: ${{ steps.classify.outputs.docker_webapp }}
          WEBAPP_ARM64: ${{ steps.classify.outputs.docker_webapp_arm64 }}
        run: node scripts/ci/docker-matrix.mjs

  # Static analysis of the repository's own plumbing - workflows, Node.js
  # scripts, Dockerfiles, and Markdown. Compiles nothing and installs no
  # language toolchain, so it finishes in well under a minute and reports
  # independently of the build jobs instead of hiding behind them.
  repo-lint:
    name: Lint workflows + scripts + Dockerfiles + Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    # It lints every tracked workflow, shell script, and Dockerfile rather than
    # the diff, so the gate is "did any file of those kinds change at all", not
    # a per-file filter. The `Plumbing` aggregate below is the required check,
    # so skipping this reports nothing to branch protection.
    if: github.ref_type != 'tag' && needs.changes.outputs.repo_lint == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          # actionlint shells out to shellcheck for `run:` blocks, so the two
          # are wanted together even though only one of them is named a step.
          tools: actionlint shellcheck hadolint node
          cargo-cache: "false"

      - name: Install root dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Workflows
        run: mise run actionlint

      - name: Shell scripts
        run: mise run shellcheck

      - name: Dockerfiles
        run: mise run hadolint

      - name: Markdown
        run: mise run docs-lint

  # Images were previously built only by the release fan-out, so a Dockerfile
  # that no longer builds surfaced at the moment it blocked a publish. hadolint
  # above reads the Dockerfile; it does not run it.
  #
  # This job builds the images from source, and each leg is gated on its actual
  # inputs rather than running for unrelated changes. CLI source changes select
  # it after merge for the nightly image; pull requests select it only when the
  # image, Cargo manifests, or toolchain plumbing changed. The webapp's source
  # build remains image-plumbing only because its release path is exercised by
  # the prebuilt smoke below.
  #
  # `DIST=prebuilt` is not the way to lift the cost here: it skips the whole
  # builder stage - rustup, the WASI SDK pins, binaryen - which is precisely the
  # fragile half this job exists to test. That path is covered instead,
  # unconditionally and for free, by the webapp prebuilt smoke below. What the
  # webapp leg does reuse is the wasm module itself, through `WASM=prebuilt` on
  # a cache hit; see the restore step. The CLI image has no wasm in it at all -
  # it is `cargo build --release -p rom-weaver-cli`.
  #
  # Both architectures build here, each on a runner of its own architecture.
  # arm64 is not a formality: the webapp Dockerfile pins an arm64 WASI SDK and
  # binaryen by sha256 that no amd64 build ever checks, so an unbuilt arm64
  # source path ships broken to self-hosters. Under QEMU that coverage cost 81
  # minutes for the CLI image and just over two hours for the webapp's, which is
  # why these are native.
  docker:
    name: Docker build (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: changes
    if: github.ref_type != 'tag' && needs.changes.outputs.docker_matrix != '[]'
    permissions:
      contents: read
      # Read to restore the cache; write so a merge to main can refresh it and
      # push the digest `docker-manifest` below assembles. A pull request from a
      # fork receives a read-only token regardless, which is why the push is
      # restricted to main anyway.
      packages: write
    strategy:
      fail-fast: false
      # Planned in `changes` above: an unselected image is absent from the
      # matrix entirely rather than starting a runner to skip its own steps.
      # Each selected image expands to one leg per architecture, each on a
      # runner of that architecture.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.docker_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The webapp image compiles the wasm module the `wasm` job has already
      # built in this same run - ~390s of this job's ~570s, spent reproducing a
      # module the cache can hand over. Restored here, the Dockerfile takes it
      # from the context instead (`WASM=prebuilt`); on a miss it compiles as
      # before, so this only ever removes duplicated work.
      #
      # Read-only, because this job never builds the module: claiming the
      # source-exact key on a miss would deny it to the `wasm` job that does,
      # permanently.
      #
      # amd64 only. The arm64 leg keeps compiling from source so every run still
      # exercises the full Dockerfile path - the WASI SDK and binaryen pins
      # included - rather than leaving it to whoever next edits the image. No
      # `needs: wasm` edge for the same reason the fast preview path has none:
      # it would make the CLI legs, which want nothing from wasm, queue behind a
      # six-minute build.
      - name: Restore the built wasm module
        id: wasm
        if: matrix.name == 'webapp' && matrix.arch == 'amd64'
        uses: ./.github/actions/wasm-cache
        with:
          variant: prod
          save: "false"

      # On main the CLI legs push by digest for `docker-nightly` to join into
      # the `nightly` manifest list, and both images refresh the build cache so
      # the next release starts warm. On a pull request nothing is pushed,
      # because a fork's token cannot write to the registry.
      #
      # Only the CLI image publishes from here. This job builds the webapp image
      # from source, which is the image-plumbing path - it compiles its own wasm
      # and would ship a bundle that is not the one deployed to
      # nightly.rom-weaver.com. The webapp `nightly` image is published from
      # `docker-prebuilt` below, off the exact artifact that deploy uses.
      - name: Build image
        uses: ./.github/actions/docker-build-arch
        with:
          image: ${{ matrix.image }}
          file: ${{ matrix.file }}
          arch: ${{ matrix.arch }}
          registry-owner: ${{ github.repository_owner }}
          build-args: ${{ steps.wasm.outputs.cache-hit == 'true' && 'WASM=prebuilt' || '' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.name == 'CLI' }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The prebuilt stage takes the binary out of `prebuilt/<arch>/`, so each
      # leg smokes the directory its own architecture resolves.
      - name: Build CLI prebuilt path
        if: matrix.name == 'CLI'
        run: |
          set -euo pipefail
          mkdir -p "prebuilt/${{ matrix.arch }}"
          printf 'stub\n' > "prebuilt/${{ matrix.arch }}/rom-weaver"
          docker build --file Dockerfile --build-arg BINARY=prebuilt --tag prebuilt-smoke .

  # The per-arch legs above push tagless digests; this is what makes them a
  # single `nightly` tag that resolves per architecture.
  docker-nightly:
    name: Docker publish (CLI, nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, docker]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.docker.result == 'success'
      && contains(needs.changes.outputs.docker_matrix, 'rom-weaver-cli')
    permissions:
      contents: read
      packages: write
      # Attesting the nightly image, so it carries the same signed provenance as
      # every image the release fan-out pushes.
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the manifest list
        id: manifest
        uses: ./.github/actions/docker-manifest
        with:
          image: rom-weaver-cli
          registry-owner: ${{ github.repository_owner }}
          tags: ghcr.io/${{ github.repository_owner }}/rom-weaver-cli:nightly

      # The manifest list, not either architecture's image: that is what a pull
      # of `:nightly` resolves against.
      - name: Sign build provenance
        uses: ./.github/actions/attest-retry
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rom-weaver-cli
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Exercise the webapp release COPY path against the real bundle built above,
  # and on main publish that same image as the webapp `nightly` channel. The
  # CLI equivalent rides in its already-gated source job, so it does not start a
  # separate runner after every Rust or webapp change.
  #
  # This is the only place the webapp `nightly` image can come from: it wraps
  # the `webapp-dist` artifact that `deploy` ships to nightly.rom-weaver.com,
  # so the image and the site are the same bundle. That is why main runs it for
  # the whole webapp stack while a pull request needs an image-side reason: the
  # job runs no builder stage, so on a pull request nothing about it can fail
  # for a bundle reason, but on main every new bundle owes nightly an image.
  docker-prebuilt:
    name: Docker build (webapp, prebuilt, ${{ matrix.arch }})
    # The matrix below only ever holds amd64 and arm64, so this reads as a pair
    # rather than a default: any third value would silently land on the arm
    # runner.
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    needs: [changes, webapp-static]
    if: github.ref_type != 'tag' && needs.changes.outputs.docker_prebuilt == 'true'
    permissions:
      contents: read
      # Only exercised on the main push below; a fork pull request receives a
      # read-only token regardless, which is why the push is gated on the ref.
      packages: write
    strategy:
      fail-fast: false
      # One architecture proves the release COPY path on a pull request. Main -
      # and the release pull request, which is main's tree - still builds both
      # architectures for the nightly manifest.
      matrix:
        arch: ${{ needs.changes.outputs.full_matrix == 'true' && fromJSON('["amd64", "arm64"]') || fromJSON('["amd64"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `.dockerignore` drops `**/dist`, which is why both this and the release
      # fan-out stage the bundle under `prebuilt/` instead.
      - name: Download prebuilt bundle
        uses: actions/download-artifact@v8
        with:
          name: webapp-dist
          path: prebuilt

      - name: Check the bundle staged
        run: test -f prebuilt/index.html

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the prebuilt path
        uses: ./.github/actions/docker-build-arch
        with:
          image: rom-weaver-webapp
          file: packages/rom-weaver-webapp/Dockerfile
          build-args: DIST=prebuilt
          arch: ${{ matrix.arch }}
          registry-owner: ${{ github.repository_owner }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # `DIST=prebuilt` skips the builder stage the cache holds, and a pull
          # request has not logged in to pull it with.
          cache-from: "false"

  # As with `docker-nightly` above: the legs push digests, this names them.
  docker-prebuilt-nightly:
    name: Docker publish (webapp, nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: docker-prebuilt
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.docker-prebuilt.result == 'success'
    permissions:
      contents: read
      packages: write
      # Same signed provenance the release fan-out attaches to every image.
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the manifest list
        id: manifest
        uses: ./.github/actions/docker-manifest
        with:
          image: rom-weaver-webapp
          registry-owner: ${{ github.repository_owner }}
          tags: ghcr.io/${{ github.repository_owner }}/rom-weaver-webapp:nightly

      - name: Sign build provenance
        uses: ./.github/actions/attest-retry
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rom-weaver-webapp
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Built once and shared. This is the single most expensive step in the
  # pipeline (~6.5 min), and it used to run identically in two jobs.
  wasm:
    name: Build WASM module
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: changes
    # Skipped whole rather than started with every step gated off. Everything
    # downstream of it - the webapp jobs, `docker-prebuilt`, and `deploy` -
    # carries the same selection, so none of them is left waiting on an
    # artifact that was never going to be built. The `Plumbing` aggregate below
    # is the required check.
    if: needs.changes.outputs.webapp == 'true'
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore built wasm module
        id: wasm-cache
        uses: ./.github/actions/wasm-cache
        with:
          variant: prod

      # A hit needs only Node/Rust to regenerate the cheap attribution files;
      # the full toolchain exists only to compile on a miss.
      - uses: ./.github/actions/setup-build-env
        with:
          tools: ${{ steps.wasm-cache.outputs.cache-hit == 'true' && 'node rust' || 'node rust binaryen' }}
          apt-packages: ${{ steps.wasm-cache.outputs.cache-hit == 'true' && '' || 'cmake ninja-build pkg-config clang libclang-dev' }}
          cargo-cache: ${{ steps.wasm-cache.outputs.cache-hit == 'true' && 'false' || 'true' }}
          rust-targets: ${{ steps.wasm-cache.outputs.cache-hit == 'true' && '' || 'wasm32-wasip1-threads' }}
          wasi-sdk: ${{ steps.wasm-cache.outputs.cache-hit == 'true' && 'false' || 'true' }}
          webapp-deps: "true"

      # Never set RUSTFLAGS here: Cargo replaces configured target flags instead
      # of extending them, silently dropping shared-memory, LTO, and exports.
      # The separate non-linking Rust check denies warnings.
      - name: Build production WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: mise run build-wasm-prod

      - name: Generate webapp attribution
        run: node scripts/gen-third-party-licenses.mjs packages/rom-weaver-webapp/src/wasm --target webapp

      # Validate completeness and the 4 GiB memory ceiling on both cache paths.
      - name: Verify wasm artifact
        run: node scripts/wasm/verify-wasm-artifact.mjs packages/rom-weaver-webapp/src/wasm

      # The wasm module and its brotli sibling are already compressed, so
      # re-compressing them into the artifact only burns time.
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-prod
          if-no-files-found: error
          compression-level: 0
          # Upload the complete bundle, including the freshly generated
          # attribution files that are intentionally outside the cache.
          path: ${{ steps.wasm-cache.outputs.path }}

  # One stable name for the repository plumbing - lint, the WASM module, the
  # images - so each of those jobs can be skipped outright when nothing it
  # consumes changed. Branch protection requires this, not the individual jobs:
  # a job removed from a matrix reports no status at all, and the ruleset has no
  # bypass actors, so an unreported required name blocks the merge forever.
  # Same shape as `rust` and `webapp` below: it runs even when its dependencies
  # skipped, and accepts a skip only where `changes` did not select the stack.
  plumbing:
    name: Plumbing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, repo-lint, docker, docker-prebuilt, wasm]
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One call per selection flag rather than one for the job: unlike `rust`
      # and `webapp`, these jobs do not share a flag, and the script's contract
      # is one flag per group. The prebuilt smoke has a flag of its own because
      # a pull request skips it for a webapp change that touched no image file,
      # which the webapp flag would report as a missing job. Every group is
      # evaluated before exiting so one skip-mismatch does not hide the others.
      - name: Verify plumbing jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_LINT_SELECTED: ${{ needs.changes.outputs.repo_lint }}
          REPO_LINT_RESULT: ${{ needs.repo-lint.result }}
          DOCKER_SELECTED: ${{ needs.changes.outputs.docker_matrix != '[]' }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          WEBAPP_SELECTED: ${{ needs.changes.outputs.webapp }}
          WASM_RESULT: ${{ needs.wasm.result }}
          DOCKER_PREBUILT_SELECTED: ${{ needs.changes.outputs.docker_prebuilt }}
          DOCKER_PREBUILT_RESULT: ${{ needs.docker-prebuilt.result }}
        run: node scripts/ci/assert-job-groups.mjs

  # Everything that needs a host-profile Rust build and nothing from wasm, so
  # it runs concurrently with the wasm build instead of queueing behind it.
  rust-host:
    name: "Rust (Linux: lint + tests)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: changes
    if: github.ref_type != 'tag' && needs.changes.outputs.rust == 'true'
    env:
      CARGO_TERM_COLOR: always
      # Full debuginfo is the bulk of a dev-profile target/, which is what this
      # job's rust-cache entry stores against the shared 10 GiB budget. Line
      # tables keep file:line in test backtraces while dropping the rest; the
      # Windows leg has run this way from the start (see its env for the
      # original reasoning). Applies to the test profile via dev-profile
      # inheritance; local builds are untouched.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whitespace check below diffs against the PR base.
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env
        with:
          tools: node rust cargo-deny cargo-machete nextest
          apt-packages: cmake ninja-build pkg-config clang libclang-dev
          rust-components: clippy rustfmt
          webapp-deps: "true"

      # This runner is x86-64, so installing the assembler here is what puts the
      # vendored LZMA SDK's x86-64 decode loop under the Rust test suite below -
      # otherwise the only asm loop CI ever exercises is the arm64 one. build.rs
      # falls back to the C loop without it, so a failure here cannot break the
      # job, only reduce what it covers.
      - name: Install the x86-64 LZMA assembler
        run: sudo scripts/install-jwasm.sh

      - name: Rust format
        run: mise run fmt

      - name: Rust clippy
        run: mise run clippy

      - name: Rust typegen
        run: mise run typegen-check

      - name: Whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        # The task reads BASE_SHA/HEAD_SHA above; the lefthook hook runs the same
        # task with neither set and checks the staged diff instead.
        run: mise run whitespace

      - name: Thread guard regressions
        run: mise run thread-guards

      - name: Rust tests
        run: mise run test-rust

      - name: Third-party attribution bundle
        run: mise run licenses-check

      # Advisories moved to the non-gating `security` job; what stays here is
      # the half we author and can always fix in the same commit.
      - name: Rust dependency policy (licenses, sources)
        run: mise run deny-policy

      - name: Unused Rust dependencies
        run: mise run machete

      - name: Verify publishable Rust packages
        # Package each crate exactly as cargo publish would, without uploading.
        # Workspace tests already compile the local dependency graph. Skip cargo's
        # per-package verification here because it resolves same-version workspace
        # dependencies from crates.io, which may still contain the pre-change graph.
        run: cargo publish --workspace --locked --dry-run --no-verify

  # Build the native targets the release publishes before a change reaches
  # release day. The target list and the build itself are shared with the
  # release fan-out (.github/cli-platforms.json,
  # .github/actions/build-cli-platform) so CI cannot cover a different set of
  # targets, or build them differently, than the one that ships.
  #
  # Pull requests build only the linux-x64-gnu entry marked `"pr": true` - all
  # but the release pull request, which is the commit that ships.
  # Pushes to main, manual dispatches, and the release fan-out build all nine,
  # so repeated macOS, Windows, and cross-target release compiles stay off the
  # review path without reducing what is proven before anything ships.
  # scripts/ci/cli-platform-matrix.mjs owns the split.
  cli-platforms:
    name: CLI target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs: changes
    if: github.ref_type != 'tag' && needs.changes.outputs.rust == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.cli_platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/build-cli-platform
        with:
          package: ${{ matrix.package }}
          target: ${{ matrix.target }}
          build: ${{ matrix.build }}
          binary: ${{ matrix.binary }}
          msvc-arch: ${{ matrix.msvc_arch }}
          msvc-host: ${{ matrix.msvc_host }}
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify release CLI
        if: matrix.package != 'linux-arm64-musl'
        run: >-
          node scripts/verify-cli-platform.mjs
          target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload Linux arm64 CLI for native test
        if: matrix.package == 'linux-arm64-musl'
        uses: actions/upload-artifact@v7
        with:
          name: ci-cli-linux-arm64-musl
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

      # The action above already staged the package; this proves npm can pack
      # what the release will publish.
      - name: Verify platform package
        shell: bash
        run: >-
          npm pack --dry-run --ignore-scripts --json
          "packages/rom-weaver-cli-platforms/${{ matrix.package }}"

  cli-linux-arm64:
    name: CLI target runtime (aarch64-unknown-linux-musl)
    runs-on: ubuntu-24.04-arm
    needs: [changes, cli-platforms]
    if: >-
      github.ref_type != 'tag' && needs.changes.outputs.full_matrix == 'true'
      && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ci-cli-linux-arm64-musl
          path: cli

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release CLI
        run: |
          chmod +x cli/rom-weaver
          node scripts/verify-cli-platform.mjs cli/rom-weaver

  # Every scanner whose input is the outside world rather than this repository.
  # Deliberately not gating: an advisory is published against a transitive
  # dependency without any commit of ours, and letting that turn each open pull
  # request red blocks unrelated work until someone lands an upgrade. Findings
  # surface as annotations and a job summary instead, so this job stays green.
  security:
    name: Security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: github.ref_type != 'tag' && needs.changes.outputs.security == 'true'
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Both scanners resolve from lockfiles and compile nothing, so this job
      # needs Rust only as the host for `cargo deny`.
      - uses: ./.github/actions/setup-build-env
        with:
          tools: node rust cargo-deny
          cargo-cache: "false"

      - name: Rust advisories
        run: node scripts/warn-only.mjs "Rust advisories" mise run deny-advisories

      # `npm audit` resolves straight from the lockfiles, so this needs node but
      # no install, keeping the webapp's `npm ci` off this job entirely.
      - name: npm advisories (root)
        run: node scripts/warn-only.mjs "npm advisories (root)" npm run audit:deps

      - name: npm advisories (webapp)
        run: node scripts/warn-only.mjs "npm advisories (webapp)" npm --prefix packages/rom-weaver-webapp run audit:deps

  # No separate `wasm-check` job. It compiled a strict subset of the production
  # module above, while the source-exact cache already covers every input that
  # could break it. The broad local gate keeps the check available to developers.

  # The release fan-out builds the CLI for macOS, but until here nothing ever
  # *tested* on it - a platform-specific regression surfaced at publish time or
  # from a user report. fmt, clippy, typegen, and the policy checks are
  # platform-independent and already gate in `rust-host`.
  #
  # Uses the same mise/setup-build-env path as the Linux jobs: mise is the
  # toolchain manager the repo's macOS development already runs on. This leg
  # needs neither the WASI SDK nor the wasm target.
  rust-macos:
    name: Rust (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    needs: changes
    if: >-
      github.ref_type != 'tag' && needs.changes.outputs.full_matrix == 'true'
      && needs.changes.outputs.rust == 'true'
    env:
      CARGO_TERM_COLOR: always
      # Same trade as rust-host above: test backtraces keep file:line while
      # the cache entry and compile shed the bulk of the debuginfo.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The runner image ships cmake and the Xcode clang, which covers the
      # vendored libarchive host build; no brew installs needed.
      - uses: ./.github/actions/setup-build-env
        with:
          tools: rust nextest

      - name: Rust tests
        run: mise run test-rust

  # Windows cannot reuse the mise path: the wasm toolchain's compiler shims
  # are Node.js scripts a native cargo cannot exec, and mise's [env] templates
  # assume a POSIX shell. The npm platform publish already proves the
  # dtolnay + rustup route on this exact image, so the tests ride that instead.
  # The toolchain pin is read from .config/mise.toml so this leg can never drift from
  # the version the other jobs test with. No wasm leg here - building the wasm
  # module on Windows is unsupported until those shims have a native
  # counterpart.
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-2025
    timeout-minutes: 90
    needs: changes
    if: >-
      github.ref_type != 'tag' && needs.changes.outputs.full_matrix == 'true'
      && needs.changes.outputs.rust == 'true'
    env:
      CARGO_TERM_COLOR: always
      # The mise legs get this from .config/mise.toml's [env]; this leg bypasses mise.
      # Incremental artifacts only bloat the rust-cache save.
      CARGO_INCREMENTAL: "0"
      # MSVC debug info (PDBs, link.exe /DEBUG) is the priciest part of a
      # Windows debug build. Line tables keep file:line in test backtraces
      # while skipping the bulk of it. Applies to the test profile via its
      # dev-profile inheritance; local builds are untouched.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # rust-lld (lld-link flavor, ships with the toolchain) links large test
      # binaries markedly faster than MSVC link.exe, and this workspace
      # produces many of them. Safe here (unlike the wasm job) because this
      # target has no configured link flags to clobber.
      RUSTFLAGS: -C linker=rust-lld
      # The workspace (and target/) already lives on D:, the runner's local
      # temp disk (~9-19k IOPS); C: is remote-backed managed storage (~4-6k
      # IOPS and often worse). Move the remaining hot paths off C:: the crate
      # registry + installed cargo binaries, the toolchain rustc/std read on
      # every compile, and the temp dirs the test suite churns through
      # (the step below points TMP/TEMP at RUNNER_TEMP, already on D:).
      # rustup, taiki-e/install-action, and rust-cache all honor these.
      CARGO_HOME: D:\cargo-home
      RUSTUP_HOME: D:\rustup-home
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The default Windows temp dir lives on the slow OS disk; the test
      # suite churns through temp fixtures, so point it at RUNNER_TEMP on the
      # local disk instead. A step because the `runner` context is not
      # available in job-level env.
      - name: Move temp dirs off the OS disk
        shell: bash
        run: |
          {
            echo "TMP=$RUNNER_TEMP"
            echo "TEMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Read pinned Rust version
        id: pin
        shell: bash
        run: |
          version=$(sed -n \
            -e 's/^rust = "\(.*\)"$/\1/p' \
            -e 's/^rust = { version = "\([^"]*\)".*}$/\1/p' \
            .config/mise.toml)
          if [ -z "$version" ]; then
            echo "::error::no rust pin found in .config/mise.toml"
            exit 1
          fi
          echo "rust=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.rust }}

      # Same restore-everywhere/save-on-main policy as the Linux jobs; the key
      # includes the OS, so this leg never collides with the others.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same version as the .config/mise.toml pin; this leg cannot use mise.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140

      # The runner image ships cmake and MSVC + LLVM, which is everything the
      # vendored libarchive build needs - the npm platform publish builds this
      # same graph with no extra installs. nextest does not execute doctests,
      # so those run as a separate cargo test --doc pass, same as the
      # test-rust mise task.
      - name: Rust tests
        run: cargo nextest run --workspace --locked

      - name: Rust doc tests
        run: cargo test --quiet --doc --workspace --locked

  # Presents one stable check name while the independent host and threaded-target
  # work runs in parallel, so branch protection has a single thing to require.
  # The `main protection` ruleset requires this context by name. It must fail
  # rather than skip when a dependency fails, hence `!cancelled()` plus the
  # explicit result assertions below - a skipped check counts as passing.
  # `!cancelled()` rather than `always()`: when the run itself is cancelled
  # (superseded by a newer push, or by hand) the dependencies report
  # `cancelled`, and `always()` would turn that into a red Rust check on a
  # build nobody finished.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, rust-host, cli-platforms, cli-linux-arm64, rust-macos, rust-windows]
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Rust jobs
        run: >-
          node scripts/ci/assert-jobs.mjs
          '${{ needs.changes.result }}'
          '${{ needs.changes.outputs.rust }}'
          'rust-host=${{ needs.rust-host.result }}'
          'cli-platforms=${{ needs.cli-platforms.result }}'

      # Same `!cancelled()` as the job above, for the same reason: this has to
      # report even when the step before it failed, but a cancelled run is not a
      # red Rust check.
      - name: Verify full native jobs
        if: ${{ !cancelled() }}
        run: >-
          node scripts/ci/assert-jobs.mjs
          '${{ needs.changes.result }}'
          '${{ needs.changes.outputs.rust == 'true' && needs.changes.outputs.full_matrix == 'true' }}'
          'cli-linux-arm64=${{ needs.cli-linux-arm64.result }}'
          'rust-macos=${{ needs.rust-macos.result }}'
          'rust-windows=${{ needs.rust-windows.result }}'

  # The webapp work consumes the prebuilt wasm module and compiles no Rust of
  # its own. Independent suites run in separate jobs so they do not serialize,
  # and the node-only work skips the Playwright install entirely. The `webapp`
  # aggregate below gives branch protection one stable name for all of it.
  webapp-static:
    name: Webapp (static)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, wasm]
    if: github.ref_type != 'tag' && needs.changes.outputs.webapp == 'true'
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          tools: node
          cargo-cache: "false"
          webapp-deps: "true"

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-prod
          path: packages/rom-weaver-webapp/src/wasm

      # Lives here rather than in the `rust` job because
      # scripts/wasm/rom-weaver-runtime-utils.test.mjs asserts the built module
      # imports only env functions the runtime provides - it reads the real
      # .wasm and needs the artifact downloaded above.
      - name: Build script tests
        run: npm test

      - name: Lint
        run: npm --prefix packages/rom-weaver-webapp run lint

      - name: Unit tests
        run: npm --prefix packages/rom-weaver-webapp run test:unit

      - name: Build
        run: npm --prefix packages/rom-weaver-webapp run build

      # Audits the bundle built above, served by the repository's own preview
      # server (HTTP/2, brotli sidecars, production cache headers), never the
      # Cloudflare preview deployment. Gating a required check on a deploy would
      # invert the `continue-on-error` boundary the deploy jobs are built around
      # - a Cloudflare outage must not turn this red - and the deploy is not
      # ordered before this job in any case.
      - name: Performance gates
        id: performance
        run: npm --prefix packages/rom-weaver-webapp run test:performance

      - name: Upload Lighthouse reports
        id: lighthouse-reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: target/lighthouse
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Lighthouse HTML reports
        id: lighthouse-pages
        if: >-
          ${{ !cancelled()
          && steps.lighthouse-reports.outputs.artifact-url != ''
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: rom-weaver-preview
          BRANCH: lighthouse-pr-${{ github.event.number }}
          PAGES_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
          PAGES_DIRECTORY: "."
          PAGES_WORKING_DIRECTORY: target/lighthouse
        run: node scripts/ci/deploy-pages.mjs

      - name: Link Lighthouse reports in summary
        if: ${{ !cancelled() && steps.lighthouse-reports.outputs.artifact-url != '' }}
        env:
          LIGHTHOUSE_REPORT_URL: ${{ steps.lighthouse-pages.outputs.url || steps.lighthouse-reports.outputs.artifact-url }}
          LIGHTHOUSE_ARTIFACT_URL: ${{ steps.lighthouse-reports.outputs.artifact-url }}
        run: |
          printf '\n[Lighthouse HTML reports](%s)' "$LIGHTHOUSE_REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf ' · [Download raw reports](%s)\n' "$LIGHTHOUSE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Lighthouse report status
        if: >-
          ${{ !cancelled()
          && steps.lighthouse-pages.outputs.url != ''
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE_OUTCOME: ${{ steps.performance.outcome }}
          LIGHTHOUSE_REPORT_URL: ${{ steps.lighthouse-pages.outputs.url }}
          LIGHTHOUSE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          state=success
          description="Lighthouse gates passed; open HTML reports"
          if [[ "$LIGHTHOUSE_OUTCOME" != "success" ]]; then
            state=failure
            description="Lighthouse gates failed; open HTML reports"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${LIGHTHOUSE_SHA}" \
            --field state="$state" \
            --field context="Lighthouse report" \
            --field description="$description" \
            --field target_url="$LIGHTHOUSE_REPORT_URL"

      # Consumed by `docker-prebuilt`, so the image's release path is smoked
      # against a real bundle. Deliberately the same name, path and options as
      # the release fan-out's upload (release.yml) - the point is for CI to
      # exercise the artifact the publish job will hand the image, so any
      # divergence here defeats it. `include-hidden-files` included: see the
      # reasoning there.
      - name: Upload webapp bundle
        uses: actions/upload-artifact@v7
        with:
          name: webapp-dist
          path: packages/rom-weaver-webapp/dist
          if-no-files-found: error
          include-hidden-files: true

  # The longest webapp suite, split across two runners. The runner script gives
  # each test file its own Vitest process and caps in-process concurrency at
  # `min(4, cores)`; a 4-core ubuntu runner is already saturated, so the only
  # way left to shorten this leg is a second machine. `--shard=<i>/2` packs the
  # files largest-first onto the lighter half, which matters because their sizes
  # (and runtimes) are very uneven - a naive alphabetical split would leave one
  # leg minutes behind and buy nothing. Two shards roughly halve this group's
  # wall clock; the aggregate below sees a matrix dependency as one combined
  # result, so a single failing shard still fails `Webapp`.
  webapp-browser:
    name: Webapp (browser ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, wasm]
    if: github.ref_type != 'tag' && needs.changes.outputs.webapp == 'true'
    strategy:
      # One shard's failure must not cancel the other: both logs are wanted, and
      # the retry-in-isolation pass makes a half-reported run hard to read.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          tools: node
          cargo-cache: "false"
          webapp-deps: "true"

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-prod
          path: packages/rom-weaver-webapp/src/wasm

      - name: Browser tests (parallel)
        env:
          # ubuntu-24.04 already ships Chrome, so this job does not need to
          # download Playwright's Chromium or install its system dependencies.
          ROM_WEAVER_SYSTEM_CHROME: "1"
          BROWSER_TEST_SHARD: ${{ matrix.shard }}/2
        run: npm --prefix packages/rom-weaver-webapp run test:browser

  # The direct WASM/browser contract. UI-only changes cannot affect this layer,
  # so the classifier skips the whole runner for them; Rust, runtime, worker,
  # storage, dependency, fixture, and CI inputs select it conservatively.
  webapp-wasm-browser:
    name: Webapp (WASM browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, wasm]
    if: >-
      github.ref_type != 'tag' && needs.changes.outputs.webapp == 'true'
      && needs.changes.outputs.wasm_runtime == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          tools: node
          cargo-cache: "false"
          webapp-deps: "true"
          playwright: "true"

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-prod
          path: packages/rom-weaver-webapp/src/wasm

      - name: Browser tests (wasm)
        run: npm --prefix packages/rom-weaver-webapp run test:browser:wasm

  # Chromium journeys, accessibility states, and the channel-icon drift check.
  # This stays selected for every webapp change: it has caught regressions in
  # rendered documentation as well as application code.
  webapp-e2e:
    name: Webapp (E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, wasm]
    if: github.ref_type != 'tag' && needs.changes.outputs.webapp == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          tools: node
          cargo-cache: "false"
          webapp-deps: "true"
          playwright: "true"

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-prod
          path: packages/rom-weaver-webapp/src/wasm

      # The per-channel app icons are committed, not built, so nothing else would
      # notice them going stale against logo.svg / the icon masters / an accent's
      # colours. Re-renders them in memory and diffs. Needs the playwright
      # chromium this job already installs.
      - name: Channel icons up to date
        run: npm --prefix packages/rom-weaver-webapp run icons:channels:check

      - name: Webapp E2E
        run: npm --prefix packages/rom-weaver-webapp run test:e2e:webapp

  webapp-webkit-e2e:
    name: Webapp (WebKit E2E)
    # The full WASM path requires WebKit OPFS. Playwright's Linux WebKit exposes
    # the API surface but hangs when the first real OPFS-backed operation starts;
    # macOS WebKit exercises the supported Safari-family implementation.
    # macos-15, not -14: Playwright freezes WebKit at rev 2251 on mac14 (and
    # mac14-arm64) via `revisionOverrides`, so that build stops gaining protocol
    # settings the client keeps adding - 1.62.0 began sending
    # `Page.overrideSetting PushAPIEnabled` and every launch died on
    # "Unknown setting". mac15 has no override and tracks the current revision.
    runs-on: macos-15
    timeout-minutes: 60
    needs: [changes, wasm]
    if: github.ref_type != 'tag' && needs.changes.outputs.webapp == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          tools: node
          cargo-cache: "false"
          webapp-deps: "true"
          playwright: "true"
          playwright-browsers: webkit

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-prod
          path: packages/rom-weaver-webapp/src/wasm

      - name: Webapp E2E (WebKit)
        run: npm --prefix packages/rom-weaver-webapp run test:e2e:webapp:webkit

  # Same shape as the `rust` aggregate above: one stable check name (`Webapp`)
  # for branch protection while the webapp jobs run in parallel. Must
  # fail rather than skip when a dependency fails (a skipped check counts as
  # passing), and `!cancelled()` keeps a superseded run from reporting red.
  webapp:
    name: Webapp
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, webapp-static, webapp-browser, webapp-wasm-browser, webapp-e2e, webapp-webkit-e2e]
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify webapp jobs
        run: >-
          node scripts/ci/assert-jobs.mjs
          '${{ needs.changes.result }}'
          '${{ needs.changes.outputs.webapp }}'
          'webapp-static=${{ needs.webapp-static.result }}'
          'webapp-browser=${{ needs.webapp-browser.result }}'
          'webapp-e2e=${{ needs.webapp-e2e.result }}'
          'webapp-webkit-e2e=${{ needs.webapp-webkit-e2e.result }}'

      # Reports even when the step above failed, but never on a cancelled run.
      - name: Verify WASM runtime jobs
        if: ${{ !cancelled() }}
        run: >-
          node scripts/ci/assert-jobs.mjs
          '${{ needs.changes.result }}'
          '${{ needs.changes.outputs.wasm_runtime }}'
          'webapp-wasm-browser=${{ needs.webapp-wasm-browser.result }}'

  # Decide which channels this ref publishes to. Channels are ordered
  # prod -> beta -> nightly, and a deploy refreshes its own channel plus every
  # less-stable one below it, so beta and nightly can never sit on code older
  # than production:
  #
  #   vX.Y.Z tag          -> prod, beta, nightly
  #   vX.Y.Z-alpha.N tag  -> beta, nightly
  #   push to main        -> nightly
  #   pull request        -> preview
  #
  # Split out of `deploy` because the channel list drives that job's matrix, and
  # a matrix can only be fed by an upstream job's output.
  deploy-plan:
    name: Webapp deploy (plan)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    # Same non-gating boundary as `deploy` below: a failure here must skip
    # deployment, not fail the build that release automation waits on.
    continue-on-error: true
    # Secrets are withheld from fork and Dependabot pull requests, so those
    # previews could only ever fail. Skip them instead of creating red checks.
    # A manual run deploys nothing unless a channel is picked explicitly.
    if: >-
      (github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_channel != 'none') ||
      needs.changes.outputs.webapp == 'true') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_channel != 'none') &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      # Non-empty only when this ref publishes a preview. `deploy-preview-fast`
      # gates on it, which keeps that job from needing the channel list parsed
      # out of `targets` in an `if:` expression.
      preview_branch: ${{ steps.plan.outputs.preview_branch }}
    steps:
      # A tag containing a hyphen after the version is a prerelease
      # (v1.2.3-alpha.1) and enters the ladder at beta; a bare vX.Y.Z enters at
      # prod. A manual run deploys exactly the channel asked for - it is a
      # break-glass override, so it does not cascade.
      - name: Resolve channels
        id: plan
        env:
          MANUAL: ${{ github.event.inputs.deploy_channel }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ -n "$MANUAL" ] && [ "$MANUAL" != "none" ]; then
            channels="$MANUAL"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            channels="preview"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              *-*) channels="beta nightly" ;;
              *)   channels="prod beta nightly" ;;
            esac
          else
            channels="nightly"
          fi
          targets=""
          for channel in $channels; do
            # `branch` is what makes a deployment production vs preview: wrangler
            # treats the project's production branch (main) as a live deploy and
            # anything else as a throwaway preview.
            branch=main
            # `label` is what the bundle shows in its masthead badge and PWA name.
            label="$channel"
            # `env` is the GitHub Deployments environment name - the public
            # hostname the channel serves, so the Deployments UI reads as the
            # site rather than an internal job label.
            case "$channel" in
              prod)    project=rom-weaver;         env=rom-weaver.com ;;
              beta)    project=rom-weaver-beta;    env=beta.rom-weaver.com ;;
              nightly) project=rom-weaver-nightly; env=nightly.rom-weaver.com ;;
              preview)
                project=rom-weaver-preview
                branch="pr-${PR_NUMBER}"
                label="pr-${PR_NUMBER}"
                env=rom-weaver-preview.pages.dev
                echo "preview_branch=$branch" >> "$GITHUB_OUTPUT"
                ;;
              *) echo "::error::unknown channel '$channel'"; exit 1 ;;
            esac
            targets="$targets$(jq -cn \
              --arg channel "$channel" \
              --arg branch "$branch" \
              --arg label "$label" \
              --arg project "$project" \
              --arg env "$env" \
              '{$channel, $branch, $label, $project, $env}')"$'\n'
          done
          matrix=$(printf '%s' "$targets" | jq -cs .)
          echo "targets=$matrix" >> "$GITHUB_OUTPUT"
          echo "Deploying ref ${GITHUB_REF_NAME} to: $channels"

  # Preview fast path. `deploy` below has to wait for the `wasm` job because it
  # takes the module from that job's artifact - a runner start, checkout,
  # verify and upload/download that a preview does not have to sit through when
  # the module is already cached. On a hit (every pull request that leaves the
  # module inputs unchanged) this restores it directly and the preview URL
  # lands ~13s sooner.
  #
  # On a miss it deploys nothing and `deploy` publishes the preview as before.
  # It must never build the module itself: that would duplicate the ~6.5 min
  # build the `wasm` job is already running for the same commit.
  #
  # Not re-running `verify-wasm-artifact` here is deliberate. The module was
  # verified when it was built and cached, and the parallel `wasm` job verifies
  # this same restore, so a corrupt cache still fails the build - just not
  # ahead of a preview upload.
  deploy-preview-fast:
    name: Webapp deploy (preview, cached wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: deploy-plan
    # Same non-gating boundary as `deploy`: a Cloudflare outage must not turn a
    # green build red.
    continue-on-error: true
    permissions:
      contents: read
      statuses: write
      deployments: write
    if: needs.deploy-plan.outputs.preview_branch != ''
    # Do not attach an Actions environment here. This job creates its explicit
    # deployment record only after the cached preview has actually uploaded.
    outputs:
      # False on a cache miss (the deploy step never ran) and equally false if
      # wrangler failed, so `deploy` picks the preview back up in both cases.
      deployed: ${{ steps.pages.outputs.url != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 60
          fetch-tags: true

      - name: Restore built wasm module
        id: wasm-cache
        uses: ./.github/actions/wasm-cache
        with:
          variant: prod
          # Read-only: this job never builds the module, so it must not claim
          # the key ahead of the `wasm` job that does.
          save: "false"

      - name: Mark preview deployment pending
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOYMENT_CHANNEL: preview
          DEPLOYMENT_STATE: pending
          STATUS_CONTEXT: Webapp Deploy / preview
        run: node scripts/ci/deployment-status.mjs

      - name: Build and deploy preview
        id: pages
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        uses: ./.github/actions/deploy-webapp-pages
        with:
          channel: preview
          label: ${{ needs.deploy-plan.outputs.preview_branch }}
          project: rom-weaver-preview
          branch: ${{ needs.deploy-plan.outputs.preview_branch }}
          generate-attribution: "true"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish preview deployment status
        if: always() && steps.wasm-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOYMENT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          DEPLOYMENT_CHANNEL: preview
          DEPLOYMENT_URL: ${{ steps.pages.outputs.url }}
          DEPLOYMENT_RECORD: "true"
          DEPLOYMENT_ENVIRONMENT: rom-weaver-preview.pages.dev
          STATUS_CONTEXT: Webapp Deploy / preview
        run: node scripts/ci/deployment-status.mjs

  # Build and publish one channel per matrix leg, to isolated Cloudflare origins
  # (rom-weaver.com, beta.rom-weaver.com, nightly.rom-weaver.com, and disposable
  # per-PR previews). `deploy-plan` above decides which legs exist.
  #
  # Direct Upload reuses the CI-tested WASM artifact without Cloudflare build
  # minutes or a second toolchain. Depend only on `wasm` so deploy URLs arrive
  # while the rest of the suite is still running.
  #
  # This is also the preview fallback: it publishes the preview whenever
  # `deploy-preview-fast` above did not, which is any pull request that missed
  # the wasm cache.
  deploy:
    name: Webapp deploy (${{ matrix.target.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [wasm, deploy-plan, deploy-preview-fast]
    # Deployment was a separate, non-gating workflow before it moved here to
    # share the wasm artifact. Preserve that boundary: a Cloudflare outage must
    # not turn a green main build red and suppress release automation.
    continue-on-error: true
    permissions:
      contents: read
      statuses: write
      deployments: write
    # `!cancelled()` because deploy-preview-fast is skipped outright on tags and
    # main, and a skipped dependency would otherwise skip this job with it. That
    # weakens the implicit "only after a good wasm build" gate, so state it.
    #
    # An empty or missing target list would be a hard "matrix contains no
    # values" error, so guard rather than trusting the planner to always emit
    # one.
    #
    # On a pull request the only leg is preview, so the last clause needs no
    # per-channel test - and job-level `if` cannot see `matrix` anyway.
    if: >-
      !cancelled() && needs.wasm.result == 'success' &&
      needs.deploy-plan.outputs.targets != '' &&
      needs.deploy-plan.outputs.targets != '[]' &&
      needs.deploy-preview-fast.outputs.deployed != 'true'
    strategy:
      # Separate Pages projects with no shared state, so they upload in
      # parallel; a release's three channels land in the time of one. The
      # channel is baked into the bundle, so each needs its own build - there is
      # no artifact to share between them.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.deploy-plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The deployed changelog is generated from the latest 50 commits
          # (scripts/version.mjs getChangelog), so a full clone is ~97 MB of
          # pack this job never reads. Tags must still come along: the version
          # string drops its `+hash` suffix only when `git tag --points-at
          # HEAD` sees the release tag, and a depth-limited fetch skips tags
          # unless asked.
          fetch-depth: 60
          fetch-tags: true

      - name: Mark deployment pending
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOYMENT_CHANNEL: ${{ matrix.target.channel }}
          DEPLOYMENT_STATE: pending
          STATUS_CONTEXT: Webapp Deploy / ${{ matrix.target.channel }}
        run: node scripts/ci/deployment-status.mjs

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-prod
          path: packages/rom-weaver-webapp/src/wasm

      - name: Build and deploy
        id: pages
        uses: ./.github/actions/deploy-webapp-pages
        with:
          channel: ${{ matrix.target.channel }}
          label: ${{ matrix.target.label }}
          project: ${{ matrix.target.project }}
          branch: ${{ matrix.target.branch }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish deployment status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOYMENT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          DEPLOYMENT_CHANNEL: ${{ matrix.target.channel }}
          DEPLOYMENT_URL: ${{ steps.pages.outputs.url }}
          DEPLOYMENT_RECORD: "true"
          DEPLOYMENT_ENVIRONMENT: ${{ matrix.target.env }}
          STATUS_CONTEXT: Webapp Deploy / ${{ matrix.target.channel }}
        run: node scripts/ci/deployment-status.mjs

      # Every sidecar-backed /assets/* request invokes the Pages Function, so
      # a zone Cache Rule makes the edge cache those responses and the
      # function run roughly once per URL per PoP instead of per request.
      # Safe because everything under /assets/ is content-hashed and
      # immutable; respect_origin keeps the function's own Cache-Control
      # authoritative. Zone rules only exist on the custom domains - pages.dev
      # previews stay per-request, which is fine (preview traffic is internal).
      #
      # The rule covers all custom domains, but this runs only on the nightly
      # matrix leg so release-channel deploys cannot race the ruleset
      # read-merge-write. It skips with a notice until CLOUDFLARE_ZONE_ID is
      # set and the API token carries Zone -> Cache Rules -> Edit.
      - name: Ensure zone cache rule for /assets
        if: matrix.target.channel == 'nightly'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/ci/ensure-cloudflare-assets-cache-rule.mjs

  # Both preview paths create explicit transient GitHub Deployment records. The
  # cleanup removes superseded repository objects so their timeline entries
  # disappear from the pull request, retaining the newest success and newest
  # failure.
  cleanup-preview-deployments:
    name: Webapp deploy (prune superseded history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [deploy-plan, deploy-preview-fast, deploy]
    continue-on-error: true
    permissions:
      contents: read
      deployments: write
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_ENVIRONMENT: rom-weaver-preview.pages.dev
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Delete superseded deployments for this pull request
        run: scripts/ci/cleanup-preview-deployments.sh
