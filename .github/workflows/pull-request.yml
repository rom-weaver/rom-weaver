name: PR Gates

# The two gates a contributor - rather than the code - has to clear: the CLA
# signature and a Conventional Commits pull request title. They share a file
# because they share the same security boundary. Both post a commit status
# against the pull request head rather than relying on their own check run,
# both must work for a pull request from a fork, and both are required by the
# `main protection` ruleset. The title gate also removes comments left by its
# retired reporting implementation once a title passes.
#
# `pull_request_target` runs from the base branch with a write token, which is
# what lets a fork's pull request receive a status. Nothing from
# the pull request head is ever checked out or executed here: the scripts, the
# allowlist and the commitlint config all come from the base commit, and the
# only head-supplied value either job touches is the pull request title, which
# reaches commitlint through an environment variable.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  cla:
    name: CLA Check
    # A title edit cannot change who signed, and `issue_comment` fires on plain
    # issues too, and on every unrelated comment.
    #
    # This is a cheap prefilter, NOT the signing rule: it deliberately matches
    # any comment mentioning the CLA and lets `cla-gate.mjs` decide. Spelling
    # the exact phrase out here would put it in two places, and the copy that
    # rots is the one nobody tests - a stale phrase here means the job never
    # runs and a correct signature is swallowed in silence.
    #
    # One keyword is enough, and provably so: the phrase itself ends in "the
    # CLA", and a near miss is only a near miss because it contains the whole
    # phrase - so every signing attempt, exact or not, carries this word. A
    # second keyword for re-running earned nothing that editing a comment does
    # not already do, and an undocumented one is worse than none.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action != 'edited') ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Two pushes in a row only need the newer verdict; a signing comment must
    # not be cancelled by one, so the group is per pull request and comments run
    # to completion.
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      # contents: write is for the signature file on the `cla-signatures`
      # branch only - the default branch's ruleset refuses direct pushes.
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Explicitly the base commit, never the pull request head: this checkout
      # supplies the script and the allowlist, both of which must be the
      # reviewed versions.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check contributor signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          # Who triggered the event, which on an `edited` comment is whoever
          # edited it - not necessarily its author. Anyone with write access can
          # edit somebody else's comment, so signing requires these to agree.
          COMMENT_SENDER: ${{ github.event.sender.login }}
        # `CLA_REF` is resolved here rather than from the event, because the
        # checkout ref is a branch name on `issue_comment` - and that is the
        # signing path, so the record would pin to a moving `main` exactly when
        # it matters. `rev-parse` names the commit whose CLA text this run read.
        run: |
          CLA_REF="$(git rev-parse HEAD)" node scripts/ci/cla-gate.mjs

  pr-title:
    name: Title Check
    env:
      STATUS_CONTEXT: PR Title Lint
    # Only a title edit can change the outcome; body and base edits cannot. A
    # comment cannot change it at all, so this half sits out `issue_comment`.
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action != 'edited' || github.event.changes.title != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Release Please can edit its own pull request within seconds, and a human
    # retitling by hand types several edits in a row. Only the newest verdict
    # matters; a superseded run can leave only a temporary pending status.
    concurrency:
      # The fallback is never used - the job sits out `issue_comment` - but an
      # empty group is not a legal value even on a skipped job.
      group: pr-title-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Mark title check pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --field state=pending \
            --field context="$STATUS_CONTEXT" \
            --field description="Checking pull request title" \
            --field target_url="$STATUS_TARGET_URL"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Check pull request title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          lint_title() {
            npm exec --yes --package="@commitlint/cli@21.2.1" --package="@commitlint/config-conventional@21.2.0" -- \
              commitlint --config .config/commitlint.config.mjs
          }
          # commitlint uses exit 1 for invalid titles and broken installs/configs.
          # A known-good title proves the gate works before we classify the PR.
          if ! preflight_output=$(printf '%s\n' "chore(ci): preflight" | lint_title 2>&1)
          then
            printf '%s\n' "$preflight_output" | sed 's/^/commitlint: /'
            echo "::error title=commitlint failed to run::The title gate is broken, not the pull request title"
            exit 1
          fi
          if output=$(printf '%s\n' "$PULL_REQUEST_TITLE" | lint_title 2>&1)
          then
            state=success
            description="Pull request title follows Conventional Commits"
          else
            printf '%s\n' "$output" | sed 's/^/commitlint: /'
            state=failure
            description="Rename the pull request to type(scope): description"
            echo "::error title=Invalid pull request title::$description"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --field state="$state" \
            --field context="$STATUS_CONTEXT" \
            --field description="$description" \
            --field target_url="$STATUS_TARGET_URL"
          if [ "$state" = success ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
              --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- rom-weaver-pr-title-gate -->"))) | .id' |
              while read -r comment_id; do
                [ -z "$comment_id" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
              done
          fi

      - name: Mark broken title gate
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --field state=error \
            --field context="$STATUS_CONTEXT" \
            --field description="Title gate failed to run; re-run this workflow" \
            --field target_url="$STATUS_TARGET_URL"
