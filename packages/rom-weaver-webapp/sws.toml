# Cross-origin isolation - required for SharedArrayBuffer (wasm threads).
# Applied to every response so it survives a TLS-terminating reverse proxy.
[[advanced.headers]]
source = "**"

[advanced.headers.headers]
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"
Cross-Origin-Resource-Policy = "same-origin"

# Deploys replace the whole asset set, so HTML or the service worker held past a
# redeploy would reference hashed URLs that now 404. Only /assets/* is cached
# long, by the built-in policy above.
[[advanced.headers]]
# Every path except /assets/**, spelled as a glob because sws header rules have
# no negation: the first path segment is anything but "assets", a prefix of it,
# or "assets" followed by more name.
source = "/{,[!a]*,a,a[!s]*,as,as[!s]*,ass,ass[!e]*,asse,asse[!t]*,asset,asset[!s]*,assets[!/]*}"

[advanced.headers.headers]
Cache-Control = "no-cache"

# Revalidate these /assets/* types instead of the built-in max-age. Revalidating
# is cheap with ETag. Other types under /assets/ (such as the identify packs) keep
# the built-in policy: one day for types it does not know, one year for scripts,
# styles and source maps.
[[advanced.headers]]
source = "/assets/**/*.{wasm,json,bin}"

[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
# Directory requests MUST match the resolved index path in sws header rules.
source = "/index.html"

[advanced.headers.headers]
Link = '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/json", </docs/webapp-integration#url-sessions>; rel="service-doc"; type="text/html", </llms.txt>; rel="describedby"; type="text/plain", </index.md>; rel="alternate"; type="text/markdown"'

# The RFC 9727 API catalog has no file extension, so sws would send it as a
# binary download. The Link header serves the RFC 9727 HEAD response.
[[advanced.headers]]
source = "/.well-known/api-catalog"

[advanced.headers.headers]
Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'
Link = '</.well-known/api-catalog>; rel="api-catalog"'
