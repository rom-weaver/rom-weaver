# Cross-origin isolation - required for SharedArrayBuffer (wasm threads).
# Applied to every response so it survives a TLS-terminating reverse proxy.
[[advanced.headers]]
source = "**"

[advanced.headers.headers]
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"
Cross-Origin-Resource-Policy = "same-origin"

# The RFC 9727 API catalog has no file extension, so sws would send it as a
# binary download. The Link header serves the RFC 9727 HEAD response.
[[advanced.headers]]
source = "/.well-known/api-catalog"

[advanced.headers.headers]
Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'
Link = '</.well-known/api-catalog>; rel="api-catalog"'
