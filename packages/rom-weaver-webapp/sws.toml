[general]
# 0.0.0.0 so Docker's IPv4 port forwarding reaches it; 8080 is unprivileged
# (the image runs as non-root).
host = "0.0.0.0"
port = 8080
root = "/srv"

# sws hides dotfiles by default and answers them with a 404, and the
# RFC 9727 API catalog lives at /.well-known/api-catalog. This also serves the
# build's .vite/manifest.json, which the Pages deployment already publishes.
ignore-hidden-files = false

# Serve the Docker-generated *.br siblings directly instead of compressing live.
compression-static = true

# Fallback for the few clients that do not accept brotli: no *.gz is baked into
# the image, so they get gzipped on demand instead. Default-on in sws, set here
# because `compression-static` above now depends on it for full coverage.
# Leave the level alone - `best` would mean brotli quality 11 per request, and
# sws compresses every response from scratch.
compression = true

# There is no page-fallback: every route is a prerendered file, so a path with none is a real 404
# served from /srv/404.html. A 200 index.html fallback would let a CDN keep HTML under a missing
# hashed /assets/* URL.
#
# Do not set page404: a TOML value overrides the --page404 the entrypoint passes for BASE_PATH.
#
# No-log /health endpoint for probes.
health = true

# The built-in per-type max-age gives hashed /assets/* scripts and styles a year. From sws 2.44.1 it
# skips missing files, which get no-cache. The header rules below set no-cache outside /assets/,
# and none sets a long max-age, because sws applies header rules to a 404 as well.
cache-control-headers = true

log-level = "info"

