    <style>
      /* Match the token backgrounds until the parser-time script sets data-theme.
       * These fallback colors MUST stay in sync with tokens.css. */
      html:not([data-theme]) {
        background: #0c0f13;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) {
          background: #ece9e1;
        }
      }
      html[data-onboarding-enabled="false"] .first-weave-demo {
        display: none;
      }
    </style>
    <script>
      // Resolve data-theme/data-accent before first paint so the prerendered shell
      // inside #webapp-root paints with the :root[data-theme] design tokens instead
      // of waiting for theme.ts in the bundle. Mirrors theme.ts (stored preference,
      // else prefers-color-scheme, dark default) and accent.ts (settings store's
      // accent field; madder = no attribute). theme.ts/accent.ts re-apply the same
      // values on boot, so this only moves the attribute earlier - keep in sync.
      (function () {
        try {
          const stored = localStorage.getItem("rom-weaver-theme");
          const preferred = stored === "light" || stored === "dark" ? stored : "";
          const system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", preferred || system);
          const settings = JSON.parse(localStorage.getItem("rom-weaver-settings") || "null");
          const common = settings && settings.common ? settings.common : null;
          // Read these fields without a schema-version gate so compatible saved
          // preferences apply before boot; each read checks the field's type.
          document.documentElement.dataset.betaToolsEnabled =
            common && common.betaToolsEnabled === true ? "true" : "false";
          document.documentElement.dataset.onboardingEnabled =
            common && common.onboardingEnabled === false ? "false" : "true";
          const storedAccent = common && typeof common.accent === "string" ? common.accent : "";
          // Must list every value in accent.ts's ACCENTS; a missing one falls
          // through to the channel default and snaps on boot. Pinned by
          // tests/unit/accent-palette.test.ts.
          const accents = ["madder", "woad", "violet", "verdigris", "teal", "plum"];
          const accent = accents.includes(storedAccent)
            ? storedAccent
            : document.documentElement.getAttribute("data-accent") || "madder";
          if (accent === "madder") document.documentElement.removeAttribute("data-accent");
          else document.documentElement.setAttribute("data-accent", accent);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.dataset.betaToolsEnabled = "false";
          document.documentElement.dataset.onboardingEnabled = "true";
        }
      })();
    </script>
    <script>
      // Seed --wall-clock (epoch seconds) before first paint so the prerendered
      // hero's extension ticker starts at its wall-clock phase. Hydration keeps
      // that node and clock; later ticker mounts refresh the phase in layout.tsx.
      // See formats-ticker in dropzone.css.
      document.documentElement.style.setProperty("--wall-clock", `${Date.now() / 1000}s`);
    </script>

    <script>
      // Buffer clicks that land on the prerendered shell before React's first
      // mount attaches any handler - without this they are silently swallowed.
      // Has to be inline: the bundle is a module, so it only runs after the HTML
      // is parsed, while the shell is painted and clickable well before that.
      // src/webapp/shell-click-replay.ts describes the targets before hydration
      // and replays what it can once React's handlers are attached.
      (function () {
        function record(event) {
          if (buffer.clicks.length < 4) buffer.clicks.push({ target: event.target, time: Date.now() });
        }
        var buffer = {
          clicks: [],
          stop: function () {
            document.removeEventListener("click", record, true);
          },
        };
        window.ROM_WEAVER_SHELL_CLICKS = buffer;
        document.addEventListener("click", record, true);
      })();
    </script>
    <script>
      // Called by the tiny parser-blocking script injected immediately after
      // the prerendered masthead metadata. It resolves both slots before the
      // rest of the shell can paint, and produces the exact text React hydrates.
      window.ROM_WEAVER_RESOLVE_SHELL_IDENTITY = function () {
        const threadSlot = document.querySelector(".masthead-threads");
        const threadCount = threadSlot?.querySelector(".masthead-threads-count");
        const statusSlot = document.querySelector(".sub-status");
        const statusIcon = statusSlot?.querySelector("svg");
        const statusText = statusSlot?.querySelector(".sub-status-text");
        if (!(threadSlot && threadCount && statusSlot && statusIcon && statusText)) return;

        const hardwareConcurrency = navigator.hardwareConcurrency;
        const hardwareThreads =
          typeof hardwareConcurrency === "number" && Number.isFinite(hardwareConcurrency) && hardwareConcurrency > 0
            ? Math.floor(hardwareConcurrency)
            : 4;
        let threads =
          typeof SharedArrayBuffer === "function" && window.crossOriginIsolated
            ? Math.min(64, Math.max(4, hardwareThreads))
            : 1;

        try {
          const stored = JSON.parse(localStorage.getItem("rom-weaver-settings") || "null");
          const applyCompression = stored?.apply?.compression;
          const createCompression = stored?.create?.compression;
          // No version gate - see the theme/accent script above. The parse
          // below rejects anything that is not a whole thread count.
          if (applyCompression || createCompression) {
            const configured =
              applyCompression?.threads ??
              applyCompression?.workerThreads ??
              createCompression?.threads ??
              createCompression?.workerThreads;
            const parsed = Number.parseInt(String(configured ?? ""), 10);
            if (Number.isFinite(parsed) && parsed >= 1)
              threads =
                typeof SharedArrayBuffer === "function" && window.crossOriginIsolated ? Math.min(64, parsed) : 1;
          }
        } catch {
          // Fall back to the browser default; the app does the same for bad storage.
        }

        const label = threadSlot.dataset.threadLabel || "threads";
        threadCount.textContent = String(threads);
        threadSlot.setAttribute("aria-label", `${threads} ${label}`);

        // Same glyphs and wording as RuntimeGlyph/RUNTIME_MESSAGES in shell.tsx -
        // React hydrates against exactly what is written here.
        const glyphs = {
          active:
            '<path d="m17 15-5.5 5.5L9 18"></path><path d="M5.516 16.07A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 3.501 7.327"></path>',
          disabled:
            '<path d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057"></path><path d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78"></path><path d="m2 2 20 20"></path>',
          installing: '<path d="M21 12a9 9 0 1 1-6.219-8.56"></path>',
          ready:
            '<path d="M12 22V12"></path><path d="m16 17 2 2 4-4"></path><path d="M21 11.127V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l1.32-.753"></path><path d="M3.29 7 12 12l8.71-5"></path><path d="m7.5 4.27 8.997 5.148"></path>',
          update:
            '<path d="M12 13v8l-4-4"></path><path d="m12 21 4-4"></path><path d="M4.393 15.269A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.436 8.284"></path>',
        };
        const wording = {
          active: "Offline active",
          disabled: "Offline support off",
          installing: "Installing offline copy",
          ready: "Offline ready",
        };
        // Lucide class names for the same glyphs, so React finds the class it
        // renders on the svg and does not report a hydration mismatch on it.
        const iconClasses = {
          active: "lucide-cloud-check",
          disabled: "lucide-cloud-off",
          installing: "lucide-loader-circle",
          ready: "lucide-package-check",
          update: "lucide-cloud-download",
        };
        const serviceWorkerEnabled = document.documentElement.dataset.serviceWorkerEnabled === "true";
        // The wording above is the English source. In another locale React owns
        // the strings, so only the glyph and the state attribute are resolved
        // early - both are locale-independent.
        const english = (document.documentElement.lang || "en").indexOf("en") === 0;
        const setRuntimeStatus = (state) => {
          statusSlot.dataset.sw = state;
          statusIcon.setAttribute("class", `lucide ${iconClasses[state]}`);
          statusIcon.innerHTML = glyphs[state];
          if (!english) return;
          statusSlot.setAttribute("aria-label", wording[state]);
          statusSlot.setAttribute("title", wording[state]);
          statusText.textContent = wording[state];
        };

        // A controller means a service worker controls this page; it does not
        // prove this navigation used the cache. Keep this readiness fallback in
        // sync with shell.tsx and the warm-up client's persisted completion flag.
        let warmupReady = false;
        try {
          warmupReady = localStorage.getItem("rom-weaver-offline-ready") === "true";
        } catch {
          warmupReady = false;
        }
        if (!(serviceWorkerEnabled && navigator.serviceWorker)) setRuntimeStatus("disabled");
        else if (navigator.serviceWorker.controller && warmupReady)
          setRuntimeStatus(typeof MessageChannel === "function" ? "active" : "ready");
        else setRuntimeStatus("installing");
      };
    </script>
