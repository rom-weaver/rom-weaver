<title id="title">rom-weaver — Desktop README banner (light)</title>
<desc id="desc">A browser &amp; CLI toolkit. Your ROM workflow. One toolkit. Patch, Compress, Extract, Convert, Cheats, Saves. 21 patch formats. CHD, RVZ and Z3DS; 7z and ZIP compression. Broad archive and disc-image extraction. Native CLI speed. Browser convenience. rom-weaver.com.</desc>
