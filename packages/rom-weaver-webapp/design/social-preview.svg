<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>rom-weaver — Make more of your ROMs</title>
  <desc>A cartridge RW logo beside the rom-weaver name, with tools to patch, convert, and inspect ROMs in your browser or CLI.</desc>
  <defs>
    <pattern id="weave" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M0 16h64M0 48h64M16 0v64M48 0v64" fill="none" stroke="#f6ecda" stroke-width="1" opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#f4f0e8"/>
  <rect x="824" width="456" height="640" fill="#20282d"/>
  <rect x="824" width="456" height="640" fill="url(#weave)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="126" fill="#20282d" font-size="68" font-weight="700" letter-spacing="-2.4">rom<tspan fill="#77766d" font-weight="400">-</tspan><tspan fill="#b03a0a">weaver</tspan></text>
    <text x="75" y="174" fill="#62645f" font-size="15" font-weight="600" letter-spacing="2.2">THE ROM &amp; DISC IMAGE TOOLKIT</text>
    <g fill="#20282d" font-size="76" font-weight="700" letter-spacing="-2.8">
      <text x="72" y="294">Make more</text>
      <text x="72" y="380">of your ROMs.</text>
    </g>
    <text x="76" y="442" fill="#505851" font-size="27">Patch. Convert. Inspect.</text>
    <path d="M76 500H748" stroke="#c9cbc2"/>
    <text x="76" y="551" fill="#20282d" font-size="23" font-weight="600">In your browser or CLI.</text>
    <text x="76" y="584" fill="#62645f" font-size="19">Your files stay on your device.</text>
    <text x="1052" y="552" fill="#f6ecda" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="-.3">rom-weaver.com</text>
  </g>
  <svg x="852" y="114" width="400" height="400" viewBox="0 0 64 64" color="#f6ecda" aria-hidden="true">
    <path fill="currentColor" fill-rule="evenodd" d="M11 4h10v6h21V4h11a5 5 0 0 1 5 5v46a5 5 0 0 1-5 5h-8v-7h-5v7h-5v-7h-6v7h-5v-7h-5v7h-8a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5Z M16 17h14c4.5 0 7 3.5 7 7s-1.5 5.8-4.5 7l5 8h-6l-7.5-11h5c3 0 3-5 0-5h-7v17h-6Z"/>
    <path class="brand-mark-accent" fill="#d9690f" d="M23 30l8 12 1.8-4h4.6l2 4 3.6-12H51l-7.4 20h-5.5l-2.3-4.3L33.5 50h-5l-5.5-11Z"/>
  </svg>
</svg>
