<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>rom-weaver social preview</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a20"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#d9690f" stop-opacity=".24"/>
      <stop offset="1" stop-color="#d9690f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M-12 12 12-12M0 48 48 0M36 60 60 36" fill="none" stroke="#f6ecda" stroke-opacity=".035" stroke-width="2"/>
      <path d="m-12 36 24 24M0 0l48 48M36-12l24 24" fill="none" stroke="#88a9cb" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#weave)"/>
  <circle cx="300" cy="220" r="390" fill="url(#glow)" opacity=".6"/>
  <rect x="40" y="30" width="1200" height="580" rx="18" fill="#161b21" stroke="#39414e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="72" y="30" width="1136" height="2" rx="1" fill="#d9690f" opacity=".8"/>

  <g filter="url(#shadow)">
    <rect x="64" y="64" width="430" height="512" rx="42" fill="#2c323b" stroke="#43505f" stroke-width="2"/>
    <rect x="86" y="86" width="386" height="468" rx="30" fill="#202730" stroke="#181e25" stroke-width="4"/>
    <svg x="103" y="103" width="352" height="352" viewBox="0 0 64 64" aria-hidden="true" style="color:#f6ecda">
      <path fill="currentColor" fill-rule="evenodd" d="M14 4h8v6h20V4h8a6 6 0 0 1 6 6v44a6 6 0 0 1-6 6h-7v-9h-5v9h-5v-9h-5v9h-5v-9h-5v9h-4a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6Zm2 14 7 25h7l2-6 2 6h7l7-25h-8l-3 14-5-10-5 10-3-14Z"/>
      <path fill="#d9690f" d="M42 4h8a6 6 0 0 1 6 6H42Z"/>
    </svg>
    <rect x="131" y="489" width="296" height="10" rx="5" fill="#181e25"/>
    <rect x="146" y="489" width="42" height="10" rx="5" fill="#d9690f"/>
    <rect x="202" y="489" width="42" height="10" rx="5" fill="#d9690f"/>
    <rect x="258" y="489" width="42" height="10" rx="5" fill="#d9690f"/>
    <rect x="314" y="489" width="42" height="10" rx="5" fill="#d9690f"/>
    <rect x="370" y="489" width="42" height="10" rx="5" fill="#d9690f"/>
  </g>

  <g font-family="Helvetica">
    <text x="520" y="160" fill="#edf0f5" font-size="58" font-weight="760" letter-spacing="-1.5">rom<tspan fill="#939cab" font-weight="400">-</tspan><tspan fill="#ef8534">weaver</tspan></text>
    <rect x="522" y="186" width="98" height="7" rx="3.5" fill="#d9690f"/>
    <rect x="632" y="186" width="58" height="7" rx="3.5" fill="#88a9cb"/>

    <text x="520" y="260" fill="#edf0f5" font-size="24" font-weight="700">Local-first toolkit for ROMs and disc images:</text>
    <text x="520" y="318" fill="#b3bbc8" font-size="20" font-weight="600">inspect, extract, compress, and apply,</text>
    <text x="520" y="350" fill="#b3bbc8" font-size="20" font-weight="600">create, or bundle patches.</text>
    <text x="520" y="382" fill="#ef8534" font-size="20" font-weight="650">Offline via a browser service-worker PWA or CLI.</text>

    <g font-family="monospace" font-size="14" text-anchor="middle">
      <rect x="520" y="515" width="140" height="38" rx="19" fill="#0f1318" stroke="#39414e"/>
      <rect x="670" y="515" width="210" height="38" rx="19" fill="#0f1318" stroke="#d9690f" stroke-opacity=".7"/>
      <rect x="890" y="515" width="318" height="38" rx="19" fill="#0f1318" stroke="#39414e"/>
      <text x="590" y="540" fill="#edf0f5">rom-weaver.com</text>
      <text x="775" y="540" fill="#ef8534">npx rom-weaver --help</text>
      <text x="1049" y="540" fill="#b3bbc8">github.com/rom-weaver/rom-weaver</text>
    </g>
  </g>
</svg>
