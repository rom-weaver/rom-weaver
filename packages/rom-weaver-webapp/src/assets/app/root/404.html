<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — rom-weaver</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0c0f13" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --chassis: #0c0f13;
        --ink: #edf0f5;
        --ink-2: #b3bbc8;
        --ink-4: #939cab;
        --plate: #1c222a;
        --seam: #39414e;
        --thread: #d9690f;
        --thread-ink: #1c1206;
        --thread-text: #ef8534;
        --well: #0f1318;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --chassis: #ece9e1;
          --ink: #1a1d22;
          --ink-2: #4b5159;
          --ink-4: #686d76;
          --plate: #fff;
          --seam: #d4d2ca;
          --thread-text: #b03a0a;
          --well: #efede6;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        margin: 0;
        background: radial-gradient(
            1100px 320px at 50% -140px,
            color-mix(in oklab, var(--thread) 5%, transparent),
            transparent 70%
          )
          var(--chassis);
        color: var(--ink);
        font:
          500 1rem/1.5 "Arial Narrow",
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-stretch: 94%;
        -webkit-font-smoothing: antialiased;
      }
      .app {
        width: 100%;
        max-width: 880px;
        min-height: 100svh;
        margin-inline: auto;
        padding-inline: clamp(10px, 2.5vw, 28px);
        display: flex;
        flex-direction: column;
      }
      .masthead {
        display: flex;
        align-items: center;
        gap: clamp(11px, 2.25px + 1.5625vw, 16px);
        flex-wrap: wrap;
        padding-block: clamp(8px, 2vw - 3px, 12px) clamp(6px, 2vw - 5px, 10px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: clamp(8px, 1px + 1.25vw, 12px);
        flex: none;
        color: var(--ink);
      }
      .brand img {
        width: clamp(30px, 2.7vw + 20.6px, 44px);
        height: auto;
        aspect-ratio: 1;
        border-radius: 8px;
      }
      .brand-word {
        font-size: clamp(1.12rem, 0.96rem + 0.72vw, 1.42rem);
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .brand-hy {
        color: var(--ink-4);
        font-weight: 400;
      }
      .brand-word b {
        color: var(--thread-text);
      }
      .modes {
        margin-inline: auto;
      }
      .mode-rail {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--seam);
        border-radius: 9px;
        background: var(--well);
      }
      .mode {
        min-height: 34px;
        padding: 6px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 6px;
        color: var(--ink-2);
        font-size: 0.8rem;
        font-weight: 650;
        letter-spacing: 0.05em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .mode:first-child {
        background: var(--thread);
        color: var(--thread-ink);
      }
      .mode svg,
      .tool svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }
      .masthead-tools {
        display: inline-flex;
        gap: 2px;
      }
      .tool {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--ink-2);
      }
      .tool:last-child {
        color: var(--thread-text);
      }
      .mode:focus-visible,
      .tool:focus-visible,
      .return:focus-visible {
        outline: 2px solid var(--thread);
        outline-offset: 2px;
      }
      @media (hover: hover) {
        .mode:not(:first-child):hover,
        .tool:hover {
          border-color: var(--seam);
          background: var(--well);
          color: var(--ink);
        }
        .tool:last-child:hover {
          color: var(--thread);
        }
      }
      .seam {
        height: 4px;
        background: repeating-linear-gradient(-55deg, transparent 0 2px, var(--seam) 2px 5px, transparent 5px 7px);
      }
      main {
        flex: 1;
        display: grid;
        padding-block: clamp(16px, 4vw, 36px);
      }
      .not-found {
        min-height: min(620px, calc(100svh - 120px));
        overflow: hidden;
        display: grid;
        place-items: center;
        border: 1px solid var(--seam);
        border-radius: 13px;
        background:
          repeating-linear-gradient(
            90deg,
            color-mix(in oklab, var(--thread) 7%, transparent) 0 1px,
            transparent 1px 13px
          ),
          var(--plate);
      }
      .not-found-content {
        display: grid;
        justify-items: center;
        gap: clamp(24px, 5vw, 40px);
      }
      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(7rem, 35vw, 19rem);
        font-stretch: 90%;
        font-weight: 800;
        letter-spacing: -0.09em;
        line-height: 0.8;
      }
      h1::first-letter {
        color: var(--thread-text);
      }
      .return {
        min-height: 40px;
        padding: 9px 18px;
        border-radius: 6px;
        background: var(--thread);
        color: var(--thread-ink);
        font-weight: 700;
        text-decoration: none;
      }
      @media (hover: hover) {
        .return:hover {
          filter: brightness(1.08);
        }
      }
      @media (max-width: 860px) {
        .masthead {
          gap: 8px;
        }
        .masthead-tools {
          margin-inline-start: auto;
        }
        .modes {
          order: 3;
          flex-basis: 100%;
          margin-inline: 0;
        }
        .mode-rail {
          display: flex;
          width: 100%;
        }
        .mode {
          flex: 1;
        }
      }
      @media (max-width: 720px) {
        .masthead {
          display: grid;
          grid-template-columns: minmax(112px, 1fr) auto;
          grid-template-areas:
            "brand tools"
            "modes modes";
          gap: 6px;
          padding-block: 5px 6px;
        }
        .brand {
          grid-area: brand;
        }
        .masthead-tools {
          grid-area: tools;
          margin: 0;
        }
        .modes {
          grid-area: modes;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <span class="brand">
          <img alt="" height="44" src="/logo.svg" width="44" />
          <span class="brand-word">rom<span class="brand-hy">-</span><b>weaver</b></span>
        </span>
        <nav aria-label="Workflow mode" class="modes">
          <div class="mode-rail">
            <a class="mode" href="/weave">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <g stroke="currentColor" stroke-width="2">
                  <rect height="19" rx="4.5" transform="rotate(-45 2 8.364)" width="9" x="2" y="8.364"></rect>
                  <path
                    d="m11.9 18.264-.354.353a4.5 4.5 0 0 1-6.364 0 4.5 4.5 0 0 1 0-6.364l.354-.353M11.9 5.536l.353-.354a4.5 4.5 0 0 1 6.364 0 4.5 4.5 0 0 1 0 6.364l-.354.354"
                  ></path>
                </g>
              </svg>
              <span>Weave</span>
            </a>
            <a class="mode" href="/create">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="18" cy="18" r="3"></circle>
                <circle cx="6" cy="6" r="3"></circle>
                <path d="M13 6h3a2 2 0 0 1 2 2v7"></path>
                <path d="M11 18H8a2 2 0 0 1-2-2V9"></path>
              </svg>
              <span>Create</span>
            </a>
          </div>
        </nav>
        <div class="masthead-tools">
          <a
            aria-label="GitHub"
            class="tool"
            href="https://github.com/rom-weaver/rom-weaver/"
            rel="noreferrer"
            target="_blank"
            title="GitHub"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
              ></path>
              <path d="M9 18c-4.51 2-5-2-7-2"></path>
            </svg>
          </a>
          <a
            aria-label="Tip"
            class="tool"
            href="https://ko-fi.com/brandonocasey"
            rel="noreferrer"
            target="_blank"
            title="Tip"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
              ></path>
            </svg>
          </a>
        </div>
      </header>
      <div aria-hidden="true" class="seam"></div>
      <main>
        <div class="not-found">
          <div class="not-found-content">
            <h1 aria-label="404: Page not found">404</h1>
            <a class="return" href="/weave">Go to Weave</a>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
